/* ============================================================
   ROUTINE — Professional Daily / Weekly Life OS
   ============================================================ */
let routineViewMode = "today"; // today | manage

function ensureRoutineData() {
  if (!Array.isArray(S.routines)) S.routines = [];
  if (!S.routineLogs || typeof S.routineLogs !== "object") S.routineLogs = {};
  if (S.activeRoutineId === undefined) S.activeRoutineId = null;
}

function getActiveRoutine() {
  ensureRoutineData();
  if (!S.routines.length) return null;
  let r = S.routines.find(x => x.id === S.activeRoutineId);
  if (!r) {
    r = S.routines[0];
    S.activeRoutineId = r.id;
  }
  return r;
}

function getTodayLog() {
  ensureRoutineData();
  const td = today();
  if (!S.routineLogs[td]) {
    S.routineLogs[td] = { routineId: S.activeRoutineId, done: [] };
  }
  return S.routineLogs[td];
}

function routineProgress(routine) {
  if (!routine || !routine.items || !routine.items.length) return { done: 0, total: 0, pct: 0 };
  const log = getTodayLog();
  const doneSet = new Set(log.done || []);
  const total = routine.items.length;
  const done = routine.items.filter(it => doneSet.has(it.id)).length;
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}

function routineStreak(routineId) {
  if (!routineId) return 0;
  let streak = 0;
  const t = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(t);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    const log = S.routineLogs[key];
    if (!log || log.routineId !== routineId) {
      if (i === 0) continue;
      break;
    }
    const routine = S.routines.find(r => r.id === routineId);
    if (!routine || !routine.items || !routine.items.length) break;
    const allDone = routine.items.every(it => (log.done || []).includes(it.id));
    if (allDone) streak++;
    else if (i > 0) break;
  }
  return streak;
}

function renderRoutineWeekHistory(routine) {
  if (!routine) return '<div class="empty" style="padding:20px"><p>রুটিন নেই</p></div>';

  return `
    <div style="display:flex;gap:6px;justify-content:space-between">
      ${days.map(d => {
        const log = S.routineLogs[d];
        let pct = 0;
        if (log && log.routineId === routine.id && routine.items && routine.items.length) {
          const done = routine.items.filter(it => (log.done||[]).includes(it.id)).length;
          pct = Math.round(done / routine.items.length * 100);
        }
        const isToday = d === today();
        const label = d.slice(8);
        return `
          <div style="flex:1;text-align:center">
            <div style="height:56px;background:var(--bg2);border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding:4px;border:${isToday?'2px solid var(--accent)':'1px solid var(--border)'}">
              <div style="width:70%;background:${pct===100?'var(--green)':pct>0?'var(--accent)':'transparent'};height:${Math.max(pct, pct>0?12:0)}%;border-radius:6px 6px 2px 2px;transition:height .25s"></div>
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:6px;font-weight:${isToday?700:500}">${label}</div>

}

function parseTimeToMin(t) {
  if (!t || !t.includes(":")) return 0;
  const [h, m] = t.split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}

function saveRoutineItem(itemId, routineId) {
  const title = (document.getElementById("riTitle") || {}).value.trim();
  if (!title) return toast("শিরোনাম দিন", "err");
  const time = (document.getElementById("riTime") || {}).value || "06:00";
  const duration = parseInt((document.getElementById("riDur") || {}).value, 10) || 15;
  const category = (document.getElementById("riCat") || {}).value || "";
  const note = (document.getElementById("riNote") || {}).value || "";

  const routine = S.routines.find(r => r.id === routineId);
  if (!routine) return toast("রুটিন পাওয়া যায়নি", "err");
  if (!routine.items) routine.items = [];

  if (itemId) {
    // find across all routines
    for (const r of S.routines) {
      const it = (r.items || []).find(x => x.id === itemId);
      if (it) {
        Object.assign(it, { title, time, duration, category, note });
        break;
      }
    }
  } else {
    routine.items.push({
      id: uid(), title, time, duration, category, note
    });
  }
  // keep sorted by time
  routine.items.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  save(); closeModal(); render();
  toast(itemId ? "ধাপ আপডেট" : "ধাপ যোগ হয়েছে", "ok");
}

function delRoutineItem(itemId) {
  appConfirm("এই ধাপ মুছে ফেলবেন?", () => {
    for (const r of S.routines) {
      if (!r.items) continue;
      const before = r.items.length;
      r.items = r.items.filter(x => x.id !== itemId);
      if (r.items.length !== before) break;
    }
    // also clean logs
    Object.keys(S.routineLogs || {}).forEach(day => {
      if (S.routineLogs[day].done) {
        S.routineLogs[day].done = S.routineLogs[day].done.filter(id => id !== itemId);
      }
    });
    save(); render();
    toast("ধাপ মুছে ফেলা হয়েছে", "info");
  });
}

function emptyState(ico, msg, onclick) {

function calcCGPA() {
  ensureAcademic();
  const graded = S.academic.courses.filter(c => c.grade && c.credit);
  if (!graded.length) return null;
  const map = { "A+":4.0,"A":3.75,"A-":3.5,"B+":3.25,"B":3.0,"B-":2.75,"C+":2.5,"C":2.25,"D":2.0,"F":0 };
  let points = 0, credits = 0;
  graded.forEach(c => {
    const g = map[String(c.grade).toUpperCase()];
    if (g == null) return;
    points += g * (+c.credit);
    credits += +c.credit;
  });
  return credits ? (points / credits).toFixed(2) : null;
}
function upcomingAcademic() {
  ensureAcademic();
  const td = today();
  const list = [];
  S.academic.assignments.filter(a => a.status !== "done" && a.due && a.due >= td).forEach(a => list.push({ title: a.title, date: a.due, kind: "অ্যাসাইনমেন্ট" }));
  S.academic.exams.filter(e => e.date && e.date >= td).forEach(e => list.push({ title: e.title, date: e.date, kind: "পরীক্ষা" }));
  return list.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(0, 6);
}

  const expiring = S.documents.filter(d => d.expiry && d.expiry >= today() && d.expiry <= addDays(today(), 60));
  const expired = S.documents.filter(d => d.expiry && d.expiry < today());

  c.innerHTML = `
    ${expired.length || expiring.length ? `
      <div class="card" style="margin-bottom:16px;border-color:${expired.length?'var(--red)':'var(--orange)'}">

        ${expired.map(d => `<div style="font-size:13px;color:var(--red);margin-bottom:4px">${esc(d.title)} — ${d.expiry}</div>`).join("")}
        ${expiring.map(d => `<div style="font-size:13px;color:var(--orange);margin-bottom:4px">${esc(d.title)} — ${d.expiry}</div>`).join("")}
      </div>` : ""}

    <div class="filter-row">
      ${cats.map(c => `<button class="btn btn-sm ${docsFilter===c.id?"btn-primary":""}" onclick="docsFilter='${c.id}';render()">${c.label}</button>`).join("")}
    </div>

    ${!list.length ? `
      <div class="empty" style="padding:50px"><div class="big">📄</div>
        <p style="font-size:16px;font-weight:600;color:var(--text)">গুরুত্বপূর্ণ ডকুমেন্ট রাখুন</p>

          <div class="card card-hover">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">

            </div>
            <div style="font-size:15px;font-weight:700;margin:10px 0 6px">${esc(d.title)}</div>

              ${d.number ? `নম্বর: ${esc(d.number)}<br>` : ""}

            </div>
          </div>`;
      }).join("")}</div>`}
  `;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + "T12:00:00");
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

   PRESENTATIONS / SLIDES
   ============================================================ */
let slidesFilter = "all";

function ensureSlides() {
  if (!Array.isArray(S.slides)) S.slides = [];
}

function rSlides(c, tr) {
  ensureSlides();
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openSlide()">+ প্রেজেন্টেশন</button>`;
  const statuses = ["all","draft","review","final","presented"];
  const statusLabel = { all: "সব", draft: "ড্রাফট", review: "রিভিউ", final: "ফাইনাল", presented: "প্রেজেন্টেড" };
  let list = S.slides.slice();
  if (slidesFilter !== "all") list = list.filter(s => s.status === slidesFilter);
  list.sort((a,b) => (b.date||"").localeCompare(a.date||""));

  c.innerHTML = `
    <div class="filter-row">
      ${statuses.map(s => `<button class="btn btn-sm ${slidesFilter===s?"btn-primary":""}" onclick="slidesFilter='${s}';render()">${statusLabel[s]}</button>`).join("")}
    </div>
    ${!list.length ? `
      <div class="empty" style="padding:50px"><div class="big">📊</div>
        <p style="font-size:16px;font-weight:600;color:var(--text)">প্রেজেন্টেশন ও স্লাইড গুছিয়ে রাখুন</p>
        <p style="margin-bottom:16px">ক্লাস, সেমিনার, ডিফেন্স, জব — সব স্লাইড এক জায়গায়</p>
        <button class="btn btn-primary btn-lg" onclick="openSlide()">প্রথম প্রেজেন্টেশন যোগ করুন</button>
      </div>` :
      `<div class="grid g2">${list.map(s => `
        <div class="card card-hover">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
            <div style="font-size:16px;font-weight:700">📊 ${esc(s.title)}</div>
            <span class="badge ${s.status==="final"||s.status==="presented"?"b-green":s.status==="review"?"b-orange":"b-blue"}">${statusLabel[s.status]||s.status}</span>
          </div>
          <div style="font-size:12.5px;color:var(--text3);margin:8px 0;line-height:1.6">
            ${s.course ? `কোর্স/ইভেন্ট: ${esc(s.course)}<br>` : ""}
            ${s.date ? `তারিখ: ${s.date}<br>` : ""}

/* ============================================================
   BAD HABITS TRACKER
   ============================================================ */
function ensureBadHabits() {
  if (!Array.isArray(S.badHabits)) S.badHabits = [];
}

function rBadHabits(c, tr) {
  ensureBadHabits();
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openBadHabit()">+ ব্যাড হ্যাবিট</button>`;

  if (!S.badHabits.length) {
    c.innerHTML = `
      <div class="empty" style="padding:50px">
        <div class="big">⚠️</div>
        <p style="font-size:16px;font-weight:600;color:var(--text)">ব্যাড হ্যাবিট ট্র্যাকার</p>
        <p style="max-width:440px;margin:0 auto 18px;line-height:1.6">খারাপ অভ্যাস চিহ্নিত করুন, ট্রিগার বুঝুন, বিকল্প অভ্যাস সেট করুন এবং কতদিন এড়িয়ে চলছেন সেটা ট্র্যাক করুন।</p>
        <button class="btn btn-primary btn-lg" onclick="openBadHabit()">প্রথম ব্যাড হ্যাবিট যোগ করুন</button>
      </div>`;
    return;
  }

  const days = lastNDays(14);
  c.innerHTML = `
    <div class="grid g3" style="margin-bottom:18px">
      <div class="stat-card"><div class="stat-label">ট্র্যাক করা হ্যাবিট</div><div class="stat-num">${S.badHabits.length}</div></div>
      <div class="stat-card"><div class="stat-label">সেরা ক্লিন স্ট্রিক</div><div class="stat-num">${bestBadStreak()}</div><div class="stat-sub">দিন এড়িয়ে</div></div>
      <div class="stat-card"><div class="stat-label">আজ স্লিপ</div><div class="stat-num">${S.badHabits.filter(h => (h.slips||[]).includes(today())).length}</div><div class="stat-sub">হ্যাবিট</div></div>
    </div>
    ${S.badHabits.map(h => {
      const streak = badCleanStreak(h);
      const slips14 = days.filter(d => (h.slips||[]).includes(d)).length;
      return `
        <div class="card" style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">
            <div>
              <div style="font-size:16px;font-weight:700">⚠️ ${esc(h.name)}</div>
              <div style="font-size:12.5px;color:var(--text3);margin-top:4px">তীব্রতা: ${esc(h.severity||"medium")} · ক্লিন স্ট্রিক <b style="color:var(--green)">${streak} দিন</b></div>
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-sm btn-danger" onclick="logBadSlip('${h.id}')">স্লিপ লগ</button>
              <button class="btn btn-sm" style="color:var(--green);border-color:var(--green)" onclick="logBadClean('${h.id}')">আজ ক্লিন ✓</button>
              <button class="btn btn-sm" onclick="openBadHabit('${h.id}')">এডিট</button>
              <button class="btn btn-sm btn-danger" onclick="delBadHabit('${h.id}')">✕</button>
            </div>
          </div>
          ${h.trigger ? `<div style="margin-top:10px;font-size:13px"><b>ট্রিগার:</b> <span style="color:var(--text2)">${esc(h.trigger)}</span></div>` : ""}
          ${h.alternative ? `<div style="margin-top:4px;font-size:13px"><b>বিকল্প:</b> <span style="color:var(--text2)">${esc(h.alternative)}</span></div>` : ""}
          <div style="margin-top:12px">
            <div style="font-size:11px;color:var(--text3);margin-bottom:6px">শেষ ১৪ দিন (লাল = স্লিপ)</div>
            <div class="habit-scroll">
              <div class="habit-row" style="grid-template-columns:repeat(14,1fr)">
                ${days.map(d => {
                  const slipped = (h.slips||[]).includes(d);
                  const isT = d === today();
                  return `<div class="habit-cell ${slipped?"on":""} ${isT?"today":""}" style="${slipped?"background:var(--red)":""}" title="${d}${slipped?" · slip":""}">${d.slice(8)}</div>`;
                }).join("")}
              </div>
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:6px">১৪ দিনে ${slips14} বার স্লিপ</div>
          </div>
        </div>`;
    }).join("")}
  `;
}

function badCleanStreak(h) {
  const slips = new Set(h.slips || []);
  let s = 0;
  const t = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(t); d.setDate(d.getDate() - i);
    const k = localDateStr(d);
    if (slips.has(k)) {
      if (i === 0) continue;
      break;
    }
    s++;
  }
  return s;
}
function bestBadStreak() {
  let b = 0;
  (S.badHabits || []).forEach(h => { const s = badCleanStreak(h); if (s > b) b = s; });
  return b;
}
function logBadSlip(id) {
  const h = S.badHabits.find(x => x.id === id);
  if (!h) return;
  h.slips = h.slips || [];
  const td = today();
  if (!h.slips.includes(td)) h.slips.push(td);
  // remove from clean if present
  if (h.cleanDays) h.cleanDays = h.cleanDays.filter(d => d !== td);
  save(); render();
  toast("স্লিপ লগ হয়েছে — আবার শুরু করুন", "info");
}
function logBadClean(id) {
  const h = S.badHabits.find(x => x.id === id);
  if (!h) return;
  const td = today();
  h.slips = (h.slips || []).filter(d => d !== td);
  h.cleanDays = h.cleanDays || [];
  if (!h.cleanDays.includes(td)) h.cleanDays.push(td);
  save(); render();
  toast("আজ ক্লিন ✓", "ok");
}

function openBadHabit(id) {

function ensureJournal() {
  if (!S.journal || typeof S.journal !== "object") S.journal = {};
}

  ensureJournal();
  const td = today();
  if (!S.journal[td]) S.journal[td] = { did: "", learned: "", grateful: "", tomorrow: "", mood: null };
  return S.journal[td];
}
function rJournal(c, tr) {
  ensureJournal();
  if (tr) tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openJournalToday()">আজকের এন্ট্রি</button>`;
  const j = journalToday();
  const days = lastNDays(14);
  const withEntry = days.filter(d => S.journal[d] && (S.journal[d].did || S.journal[d].learned || S.journal[d].grateful));
  c.innerHTML = `
    <div class="card" style="margin-bottom:16px;background:var(--grad-soft)">
      <div style="font-weight:700;margin-bottom:4px">📔 আজকের জার্নাল</div>

    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="form-group"><label>আজ কী করলাম</label><textarea class="textarea" id="jDid" onblur="saveJournalField('did')">${esc(j.did||"")}</textarea></div>
      <div class="form-group"><label>কী শিখলাম</label><textarea class="textarea" id="jLearn" onblur="saveJournalField('learned')">${esc(j.learned||"")}</textarea></div>
      <div class="form-group"><label>কৃতজ্ঞতা (৩টি)</label><textarea class="textarea" id="jGrat" onblur="saveJournalField('grateful')">${esc(j.grateful||"")}</textarea></div>
      <div class="form-group"><label>কালকের ফোকাস</label><textarea class="textarea" id="jTom" onblur="saveJournalField('tomorrow')">${esc(j.tomorrow||"")}</textarea></div>
      <button class="btn btn-primary" onclick="saveJournalAll()">সেভ</button>
    </div>
    <div class="section-head"><h3>শেষ ১৪ দিন</h3></div>
    ${!withEntry.length ? `<div class="empty"><div class="empty-title">এখনো এন্ট্রি নেই</div></div>` :
      withEntry.map(d => {
        const x = S.journal[d];
        return `<div class="card" style="margin-bottom:8px">
          <div style="font-weight:700;margin-bottom:6px">${d===today()?"আজ":d}</div>
          ${x.did?`<div style="font-size:13px;margin-bottom:4px"><b>করেছি:</b> ${esc(x.did)}</div>`:""}
          ${x.learned?`<div style="font-size:13px;margin-bottom:4px"><b>শিখেছি:</b> ${esc(x.learned)}</div>`:""}
          ${x.grateful?`<div style="font-size:13px;margin-bottom:4px"><b>কৃতজ্ঞ:</b> ${esc(x.grateful)}</div>`:""}
          ${x.tomorrow?`<div style="font-size:13px"><b>কাল:</b> ${esc(x.tomorrow)}</div>`:""}
        </div>`;
      }).join("")}
  `;
}
function openJournalToday() { go("journal"); }
function saveJournalField(f) {
  const j = journalToday();
  const map = { did: "jDid", learned: "jLearn", grateful: "jGrat", tomorrow: "jTom" };
  const el = document.getElementById(map[f]);
  if (el) j[f] = el.value;
  save();

    <div class="card" style="margin-bottom:16px">
      <div style="height:12px;background:var(--bg2);border-radius:99px;overflow:hidden">

      <tbody>${weekDays.map(d=>`
        <tr>
          <td>${d===today()?"আজ":d.slice(5)}</td>
          <td>${S.deepWork.logs[d]||0}</td>

        </tr>`).join("")}</tbody></table></div>
  `;
}

}

            <span class="badge b-blue">${x.stage||""}</span>

          </div>
        </div>`).join("")}
  `;
}
function openInternship(id) {
  ensureInternships();
  const x = id ? S.internships.find(i=>i.id===id) : null;
  showModal(`
    <h3>${x?"এডিট":"নতুন ইন্টার্নশিপ"}</h3>
    <div class="form-group"><label>কোম্পানি</label><input class="input" id="inCo" value="${esc(x?.company||"")}"></div>
    <div class="form-group"><label>পদ / রোল</label><input class="input" id="inRole" value="${esc(x?.role||"")}"></div>
    <div class="form-group"><label>স্টেজ</label>
      <select class="select" id="inStage">
        ${["Wishlist","Applied","Interview","Offer","Rejected","Completed"].map(s=>`<option ${x?.stage===s?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="form-group"><label>ডেডলাইন</label><input type="date" class="input" id="inDead" value="${x?.deadline||""}"></div>
    <div class="form-group"><label>আবেদন লিংক</label><input class="input" id="inUrl" value="${esc(x?.url||"")}"></div>
    <div class="form-group"><label>নোট</label><textarea class="textarea" id="inNotes">${esc(x?.notes||"")}</textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">বাতিল</button>
      <button class="btn btn-primary" onclick="saveInternship('${id||""}')">সেভ</button>
    </div>
  `);
}
function saveInternship(id) {
  const data = {
    company: document.getElementById("inCo").value.trim(),
    role: document.getElementById("inRole").value.trim(),
    stage: document.getElementById("inStage").value,
    deadline: document.getElementById("inDead").value,
    url: document.getElementById("inUrl").value.trim(),
    notes: document.getElementById("inNotes").value
  };
  if (!data.company) return toast("কোম্পানি দিন", "err");
  if (id) Object.assign(S.internships.find(x=>x.id===id), data);
  else S.internships.push({ id: uid(), ...data });
  save(); closeModal(); render(); toast("সেভ", "ok");
}
function delInternship(id) {
  appConfirm("মুছবেন?", () => { S.internships = S.internships.filter(x=>x.id!==id); save(); render(); });
}

/* ============================================================
   FOLLOW-UPS
   ============================================================ */
function ensureFollowups() {
  if (!Array.isArray(S.followups)) S.followups = [];
}
function rFollowups(c, tr) {
  ensureFollowups();
  if (tr) tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openFollowup()">+ ফলো-আপ</button>`;
  const due = S.followups.filter(f => f.status !== "done" && f.nextDate && f.nextDate <= today());
  const upcoming = S.followups.filter(f => f.status !== "done").sort((a,b)=>(a.nextDate||"").localeCompare(b.nextDate||""));
  c.innerHTML = `
    ${due.length ? `<div class="card" style="margin-bottom:16px;border-color:var(--orange)">
      <div style="font-weight:700">🔔 আজ / বাকি (${due.length})</div>
      ${due.map(f=>`<div style="font-size:13px;margin-top:4px">${esc(f.person)} — ${esc(f.about||"")}</div>`).join("")}
    </div>` : ""}
    <div class="card" style="margin-bottom:16px;background:var(--grad-soft)">
      <div style="font-weight:700">🔔 ফলো-আপ লগ</div>
      <div style="font-size:13px;color:var(--text2)">মেন্টর, HR, শিক্ষক — কার সাথে কবে আবার কথা বলবেন</div>
    </div>
    ${!S.followups.length ? emptyState("🔔", "ফলো-আপ যোগ করুন", "openFollowup()") :
      upcoming.concat(S.followups.filter(f=>f.status==="done")).map(f => `
        <div class="item">
          <div class="item-body">
            <div class="item-title">${esc(f.person)}</div>
            <div class="item-meta">${esc(f.about||"")} · পরবর্তী: ${f.nextDate||"—"}</div>
          </div>
          ${f.status!=="done" ? `<button class="btn btn-sm" onclick="doneFollowup('${f.id}')">✓</button>` : `<span class="badge b-green">Done</span>`}
          <button class="btn btn-sm" onclick="openFollowup('${f.id}')">✎</button>
          <button class="btn btn-sm btn-danger" onclick="delFollowup('${f.id}')">✕</button>
        </div>`).join("")}
  `;
}
function openFollowup(id) {
  ensureFollowups();
  const f = id ? S.followups.find(x=>x.id===id) : null;
  showModal(`
    <h3>${f?"ফলো-আপ এডিট":"নতুন ফলো-আপ"}</h3>
    <div class="form-group"><label>ব্যক্তি / প্রতিষ্ঠান</label><input class="input" id="fuPerson" value="${esc(f?.person||"")}"></div>
    <div class="form-group"><label>বিষয়</label><input class="input" id="fuAbout" value="${esc(f?.about||"")}"></div>
    <div class="form-group"><label>পরবর্তী তারিখ</label><input type="date" class="input" id="fuDate" value="${f?.nextDate||""}"></div>
    <div class="form-group"><label>নোট</label><textarea class="textarea" id="fuNote">${esc(f?.note||"")}</textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">বাতিল</button>
      <button class="btn btn-primary" onclick="saveFollowup('${id||""}')">সেভ</button>
    </div>
  `);
}
function saveFollowup(id) {
  const data = {
    person: document.getElementById("fuPerson").value.trim(),
    about: document.getElementById("fuAbout").value.trim(),
    nextDate: document.getElementById("fuDate").value,
    note: document.getElementById("fuNote").value,
    status: "open"
  };
  if (!data.person) return toast("নাম দিন", "err");
  if (id) {
    const f = S.followups.find(x=>x.id===id);
    Object.assign(f, data, { status: f.status === "done" ? "done" : "open" });
  } else S.followups.push({ id: uid(), ...data });
  save(); closeModal(); render(); toast("সেভ", "ok");
}
function doneFollowup(id) {
  const f = S.followups.find(x=>x.id===id);
  if (f) { f.status = "done"; save(); render(); toast("সম্পন্ন", "ok"); }
}
function delFollowup(id) {
  appConfirm("মুছবেন?", () => { S.followups = S.followups.filter(f=>f.id!==id); save(); render(); });
}


/* ============================================================
   HEALTH — Sleep, Water, Exercise, Mood
   ============================================================ */
function ensureHealth() {
  if (!S.healthLogs || typeof S.healthLogs !== "object") S.healthLogs = {};
}
function healthToday() {
  ensureHealth();
  const td = today();
  if (!S.healthLogs[td]) S.healthLogs[td] = { sleep: null, water: 0, exercise: 0, mood: null, note: "" };
  return S.healthLogs[td];
}
function rHealth(c, tr) {
  ensureHealth();
  if (tr) tr.innerHTML = "";
  const h = healthToday();
  const days = lastNDays(7);
  const moodEmoji = { 1:"😢", 2:"😕", 3:"😐", 4:"🙂", 5:"😄" };
  c.innerHTML = `
    <div class="card" style="margin-bottom:16px;background:var(--grad-soft)">
      <div style="font-weight:700;margin-bottom:4px">💚 আজকের স্বাস্থ্য</div>
      <div style="font-size:13px;color:var(--text2)">ঘুম, পানি, ব্যায়াম ও মুড — এক জায়গায় লগ করুন</div>
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card">
        <div style="font-weight:700;margin-bottom:12px">ঘুম (ঘণ্টা)</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="number" class="input" id="hSleep" value="${h.sleep??""}" min="0" max="16" step="0.5" style="max-width:100px" placeholder="7.5">
          <button class="btn btn-primary btn-sm" onclick="saveHealthField('sleep')">সেভ</button>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:12px">পানি (গ্লাস)</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="adjHealth('water',-1)">−</button>
          <span style="font-size:28px;font-weight:800;min-width:40px;text-align:center">${h.water||0}</span>
          <button class="btn btn-sm" onclick="adjHealth('water',1)">+</button>
          <span style="font-size:12px;color:var(--text3)">লক্ষ্য ৮</span>
        </div>
        <div style="height:8px;background:var(--bg2);border-radius:99px;margin-top:12px;overflow:hidden">
          <div style="height:100%;width:${Math.min(100,(h.water||0)/8*100)}%;background:var(--grad);border-radius:99px"></div>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:12px">ব্যায়াম (মিনিট)</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="number" class="input" id="hEx" value="${h.exercise??""}" min="0" max="300" style="max-width:100px">
          <button class="btn btn-primary btn-sm" onclick="saveHealthField('exercise')">সেভ</button>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:12px">মুড</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${[1,2,3,4,5].map(m=>`
            <button class="btn ${h.mood===m?"btn-primary":""}" style="font-size:22px;padding:8px 12px" onclick="setMood(${m})">${moodEmoji[m]}</button>
          `).join("")}
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="form-group" style="margin:0">
        <label>আজকের নোট</label>
        <textarea class="textarea" id="hNote" onblur="saveHealthNote()">${esc(h.note||"")}</textarea>
      </div>
    </div>
    <div class="section-head"><h3>শেষ ৭ দিন</h3></div>
    <div class="tbl-wrap"><table class="mini" style="min-width:520px">
      <thead><tr><th>তারিখ</th><th>ঘুম</th><th>পানি</th><th>ব্যায়াম</th><th>মুড</th></tr></thead>
      <tbody>
        ${days.map(d => {
          const x = S.healthLogs[d] || {};
          return `<tr>
            <td>${d===today()?"আজ":d.slice(5)}</td>
            <td>${x.sleep!=null?x.sleep+"ঘ":"—"}</td>
            <td>${x.water||0}</td>
            <td>${x.exercise?x.exercise+"মি":"—"}</td>
            <td>${x.mood?moodEmoji[x.mood]:"—"}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table></div>
  `;
}
function logHealthToday() { go("health"); }
function adjHealth(field, delta) {
  const h = healthToday();
  h[field] = Math.max(0, (h[field]||0) + delta);
  save(); render();
}
function setMood(m) {
  healthToday().mood = m;
  save(); render();
  toast("মুড সেভ", "ok");
}
function saveHealthField(field) {
  const h = healthToday();
  if (field === "sleep") h.sleep = parseFloat(document.getElementById("hSleep").value) || null;
  if (field === "exercise") h.exercise = parseInt(document.getElementById("hEx").value, 10) || 0;
  save(); render(); toast("সেভ", "ok");
}
function saveHealthNote() {
  healthToday().note = document.getElementById("hNote").value;
  save();
}

/* ============================================================
   READING / BOOKS
   ============================================================ */
let readingFilter = "all";
function ensureBooks() {
  if (!Array.isArray(S.books)) S.books = [];
}
function rReading(c, tr) {
  ensureBooks();
  if (tr) tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openBook()">+ বই</button>`;
  const filters = ["all","reading","want","done"];
  const fl = { all:"সব", reading:"পড়ছি", want:"পড়ব", done:"শেষ" };
  let list = S.books.slice();
  if (readingFilter !== "all") list = list.filter(b => b.status === readingFilter);
  c.innerHTML = `
    <div class="filter-row">
      ${filters.map(f=>`<button class="btn btn-sm ${readingFilter===f?"btn-primary":""}" onclick="readingFilter='${f}';render()">${fl[f]} (${f==="all"?S.books.length:S.books.filter(b=>b.status===f).length})</button>`).join("")}
    </div>
    ${!list.length ? emptyState("📚", "বই ও আর্টিকেল ট্র্যাক করুন", "openBook()") :
      `<div class="grid g2">${list.map(b => `
        <div class="card card-hover">
          <div style="display:flex;justify-content:space-between;gap:8px">
            <div style="font-weight:700">${esc(b.title)}</div>
            <span class="badge ${b.status==="done"?"b-green":b.status==="reading"?"b-blue":"b-orange"}">${fl[b.status]||b.status}</span>
          </div>
          <div style="font-size:12.5px;color:var(--text3);margin:6px 0">${esc(b.author||"")} ${b.type? "· "+esc(b.type):""}</div>
          ${b.status==="reading" ? `
            <div style="height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0">
              <div style="height:100%;width:${b.progress||0}%;background:var(--grad);border-radius:99px"></div>
            </div>
            <div style="font-size:12px;color:var(--text3)">${b.progress||0}%</div>` : ""}
          ${b.notes ? `<div style="font-size:13px;color:var(--text2);margin-top:6px">${esc(b.notes)}</div>` : ""}
          <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
            ${b.url ? `<a class="btn btn-sm" href="${esc(b.url)}" target="_blank">লিংক</a>` : ""}
            <button class="btn btn-sm" onclick="openBook('${b.id}')">এডিট</button>
            <button class="btn btn-sm btn-danger" onclick="delBook('${b.id}')">মুছুন</button>
          </div>
        </div>`).join("")}</div>`}
  `;
}
function openBook(id) {
  ensureBooks();
  const b = id ? S.books.find(x=>x.id===id) : null;
  showModal(`
    <h3>${b?"বই এডিট":"নতুন বই / আর্টিকেল"}</h3>

/* ============================================================
   CALENDAR — Full modern
   ============================================================ */
let calView = "month"; // month | list

function rCal(c, tr) {
  tr.innerHTML = `${pinBtnHTML("cal")}<button class="btn btn-sm" onclick="calGoToday()">আজ</button><button class="btn btn-primary btn-sm" onclick="openEvent()">+ ইভেন্ট</button>`;
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const weekStart = (S.settings.weekStart === 1) ? 1 : 0;
  const start = (first.getDay() - weekStart + 7) % 7;
  const dim = last.getDate();
  const locale = appLocale();
  const label = calCursor.toLocaleDateString(locale,{month:"long",year:"numeric"});
  const dows = weekStart === 1
    ? (locale === "en-US" ? ["Mo","Tu","We","Th","Fr","Sa","Su"] : ["সো","ম","বু","বৃ","শু","শ","র"])
    : (locale === "en-US" ? ["Su","Mo","Tu","We","Th","Fr","Sa"] : ["র","সো","ম","বু","বৃ","শু","শ"]);
  const tdKey = today();
  const monthEvCount = S.events.filter(e => (e.date||"").startsWith(`${y}-${String(m+1).padStart(2,"0")}`)).length;
  const typeColor = { personal:"var(--accent)", academic:"var(--green)", work:"var(--orange)", exam:"var(--red)", other:"var(--text3)" };

  let body = "";
  if (calView === "month") {
    body = `<div class="cal-head">
      <button class="btn btn-sm" onclick="calNav(-1)">‹</button>
      <h3 style="font-size:17px;font-weight:800">${label}</h3>
      <button class="btn btn-sm" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:6px">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join("")}</div>
    <div class="cal-grid">`;
    for (let i=0;i<start;i++) body += `<div class="cal-cell mute"></div>`;
    for (let d=1;d<=dim;d++) {
      const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const evs = S.events.filter(e => e.date === key);
      const isToday = key === tdKey;
      body += `<div class="cal-cell${isToday?" today":""}" style="cursor:pointer" onclick="openEvent(null,'${key}')" title="${key}">
        <div class="cal-num">${d}</div>
        ${isToday?'<div style="font-size:9px;font-weight:700;color:var(--accent);margin-bottom:2px">আজ</div>':""}
        ${evs.slice(0,3).map(e=>`<div class="cal-ev" style="border-left:2px solid ${typeColor[e.type]||typeColor.other}">${esc(e.title)}</div>`).join("")}
        ${evs.length>3?`<div style="font-size:9px;color:var(--text3)">+${evs.length-3}</div>`:""}
      </div>`;
    }
    body += `</div>`;
  }

  const upcoming = S.events.filter(e => e.date >= tdKey).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const past = S.events.filter(e => e.date < tdKey).sort((a,b)=>(b.date).localeCompare(a.date)).slice(0, 8);

  body += `
    <div class="grid g3" style="margin:18px 0 12px">
      <div class="stat-card"><div class="stat-label">এই মাস</div><div class="stat-num">${monthEvCount}</div><div class="stat-sub">ইভেন্ট</div></div>
      <div class="stat-card"><div class="stat-label">আসন্ন</div><div class="stat-num">${upcoming.length}</div><div class="stat-sub">বাকি</div></div>
      <div class="stat-card"><div class="stat-label">আজ</div><div class="stat-num">${S.events.filter(e=>e.date===tdKey).length}</div><div class="stat-sub">ইভেন্ট</div></div>
    </div>
    <div class="section-head"><h3>আসন্ন ইভেন্ট</h3>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm ${calView==="month"?"btn-primary":""}" onclick="calView='month';render()">মাস</button>
        <button class="btn btn-sm ${calView==="list"?"btn-primary":""}" onclick="calView='list';render()">তালিকা</button>
      </div>
    </div>
    ${upcoming.length ? upcoming.map(e => `
      <div class="item">
        <div style="width:10px;height:10px;border-radius:50%;background:${typeColor[e.type]||typeColor.other};flex-shrink:0"></div>
        <div class="item-body">
          <div class="item-title">${esc(e.title)}</div>
          <div class="item-meta">${e.date} ${e.time||(e.allDay?"সারাদিন":"")} ${e.location?"· "+esc(e.location):""} ${e.type?"· "+e.type:""}</div>
        </div>
        <button class="btn btn-sm" onclick="openEvent('${e.id}')">এডিট</button>
        <button class="btn btn-sm btn-danger" onclick="delEvent('${e.id}')">✕</button>

function rFiles(c, tr) {

  }
  c.innerHTML = `<div class="grid g2">${S.files.map(f => {
    const isPdf = f.type==="file" && f.url && (/\.pdf($|\?)/i.test(f.url) || /pdf/i.test(f.name||""));
    let media = "";
    if (f.type==="image" && f.url) media = `<img src="${f.url}" class="media-img" style="max-height:140px;object-fit:cover;width:100%;border-radius:10px">`;
    else if (f.type==="video" && f.url) media = `<video src="${f.url}" controls style="width:100%;max-height:160px;border-radius:10px"></video>`;
    else if (f.type==="audio" && f.url) media = `<audio src="${f.url}" controls style="width:100%;margin-top:8px"></audio>`;
    else if (isPdf && f.url) media = `<iframe src="${f.url}" style="width:100%;height:160px;border:1px solid var(--border);border-radius:10px;margin-top:6px"></iframe>`;
    return `
    <div class="card card-hover">
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">${f.type==="image"?"🖼️":f.type==="video"?"🎬":f.type==="audio"?"🎵":isPdf?"📕":"📄"} ${esc(f.name)}</div>
      ${media}
      <div style="font-size:12px;color:var(--text3);margin-top:8px">${f.added||""}</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        ${f.url?`<a class="btn btn-sm" href="${f.url}" target="_blank" rel="noopener">খুলুন</a>`:""}
        <button class="btn btn-sm btn-danger" onclick="delFile('${f.id}')">মুছুন</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}
function openFile() {
  showModal(`
    <h3>ফাইল / মিডিয়া যোগ</h3>
    <div class="form-group"><label>নাম</label><input class="input" id="fN"></div>
    <div class="form-group"><label>ধরন</label>
      <select class="select" id="fTy">
        <option value="file">ফাইল / PDF / লিংক</option>
        <option value="image">ইমেজ</option>
        <option value="video">ভিডিও</option>
        <option value="audio">অডিও</option>
      </select>
    </div>
    <div class="form-group"><label>URL (YouTube / লিংক)</label><input class="input" id="fU" placeholder="https://..."></div>
    <div class="form-group"><label>অথবা ফাইল আপলোড</label><input type="file" class="input" id="fF" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"></div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px">Google লগইন থাকলে Firebase Storage-এ যাবে। নইলে ছোট ফাইল লোকাল base64।</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">বাতিল</button>
      <button class="btn btn-primary" onclick="saveFile()">সেভ</button>
    </div>
  `);
}
async function saveFile() {
  const name = document.getElementById("fN").value.trim() || "আননেমড";
  let type = document.getElementById("fTy").value;
  let url = document.getElementById("fU").value.trim();
  const fi = document.getElementById("fF");
  if (fi.files[0]) {
    const f = fi.files[0];
    if (f.type.startsWith("image/")) type = "image";
    else if (f.type.startsWith("video/")) type = "video";
    else if (f.type.startsWith("audio/")) type = "audio";
    else type = "file";
    document.getElementById("saveDot").textContent = "আপলোড হচ্ছে...";
    let cloudUrl = await uploadToCloud(f, "media");
    if (cloudUrl) {
      url = cloudUrl;
    } else {
      if (f.size > 1.8e6) return toast("ক্লাউড ছাড়া ১.৮MB এর বেশি ফাইল রাখা যায় না। Google লগইন করুন।", "err");
      try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
    }
  }
  if (!url) return toast("URL দিন অথবা ফাইল সিলেক্ট করুন", "err");
  S.files.push({ id: uid(), name, type, url, added: today() });
  save(); closeModal(); render();
}
function delFile(id) {
  appConfirm("এই ফাইল মুছে ফেলবেন?", () => {
    S.files = S.files.filter(f=>f.id!==id); save(); render(); toast("ফাইল মুছে ফেলা হয়েছে", "info");
  });
}

/* ============================================================
   CLOCK — Digital + Stopwatch + Timer
   ============================================================ */
let clockTab = "now";
let sw = { running: false, start: 0, elapsed: 0, laps: [] };
let timerState = { running: false, left: 5*60, total: 5*60 };

function rClock(c, tr) {
  // ট্যাব পরিবর্তনে ইন্টারভাল স্ট্যাক হওয়া আটকান
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  if (window._stopwatchInt) { clearInterval(window._stopwatchInt); window._stopwatchInt = null; }
  if (window._timerInt) { clearInterval(window._timerInt); window._timerInt = null; }
  if (tr) tr.innerHTML = pinBtnHTML("clock");
  const tabs = [
    { id: "now", label: "ঘড়ি" },
    { id: "stopwatch", label: "স্টপওয়াচ" },
    { id: "timer", label: "টাইমার" }
  ];
  let body = "";
  if (clockTab === "now") {
    body = `
      <div class="card" style="max-width:480px;margin:20px auto;text-align:center;padding:40px 24px">
        <div class="clock-big" id="clk" style="font-size:52px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums">--:--:--</div>
        <div class="clock-date" id="clkD" style="margin-top:12px;font-size:15px;color:var(--text2);font-weight:600"></div>
        <div id="clkTz" style="margin-top:6px;font-size:12px;color:var(--text3)"></div>
      </div>
      <div class="grid g2" style="max-width:480px;margin:0 auto">
        <div class="card" style="text-align:center;padding:16px">
          <div style="font-size:11px;color:var(--text3);font-weight:700">UTC</div>
          <div id="clkUTC" style="font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums">—</div>
        </div>
        <div class="card" style="text-align:center;padding:16px">
          <div style="font-size:11px;color:var(--text3);font-weight:700">২৪-ঘণ্টা</div>
          <div id="clk24" style="font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums">—</div>
        </div>
      </div>`;
  } else if (clockTab === "stopwatch") {
    const t = formatMs(sw.elapsed);
    body = `
      <div class="card" style="max-width:420px;margin:20px auto;text-align:center;padding:36px 24px">
        <div style="font-size:48px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums" id="swDisplay">${t}</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap">
          <button class="btn btn-primary btn-lg" onclick="swToggle()">${sw.running?"পজ":"শুরু"}</button>
          <button class="btn btn-lg" onclick="swLap()" ${!sw.running && !sw.elapsed?"disabled":""}>ল্যাপ</button>
          <button class="btn btn-lg btn-danger" onclick="swReset()">রিসেট</button>
        </div>
        <div id="swLaps" style="margin-top:20px;text-align:left;max-height:220px;overflow:auto">
          ${(sw.laps||[]).map((l,i)=>`<div class="item" style="padding:8px 12px"><div class="item-body"><div class="item-title">ল্যাপ ${i+1}</div></div><b style="font-variant-numeric:tabular-nums">${formatMs(l)}</b></div>`).join("")}
        </div>
      </div>`;
  } else {
    const mm = Math.floor(timerState.left / 60);
    const ss = timerState.left % 60;
    const pct = timerState.total ? Math.round((1 - timerState.left/timerState.total)*100) : 0;
    body = `
      <div class="card" style="max-width:420px;margin:20px auto;text-align:center;padding:36px 24px">
        <div style="font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums" id="tmDisplay">${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}</div>
        <div style="height:8px;background:var(--bg2);border-radius:99px;margin:18px 0;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--grad);border-radius:99px;transition:width .3s"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
          ${[1,5,10,15,25,45].map(m=>`<button class="btn btn-sm" onclick="timerPreset(${m})">${m} মি</button>`).join("")}
        </div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary btn-lg" onclick="clockTimerToggle()">${timerState.running?"পজ":"শুরু"}</button>
          <button class="btn btn-lg btn-danger" onclick="clockTimerReset()">রিসেট</button>
        </div>
        <div class="grid g2" style="gap:10px;margin-top:18px">
          <div class="form-group" style="margin:0"><label>মিনিট</label><input type="number" class="input" id="tmMin" value="${Math.floor(timerState.total/60)}" min="0" max="180"></div>
          <div class="form-group" style="margin:0"><label>সেকেন্ড</label><input type="number" class="input" id="tmSec" value="${timerState.total%60}" min="0" max="59"></div>
        </div>
        <button class="btn btn-sm" style="margin-top:10px" onclick="clockTimerSetCustom()">সেট করুন</button>
      </div>`;
  }
  c.innerHTML = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;justify-content:center">
      ${tabs.map(t=>`<button class="btn btn-sm ${clockTab===t.id?"btn-primary":""}" onclick="clockTab='${t.id}';render()">${t.label}</button>`).join("")}
    </div>
    ${body}
  `;
  if (clockTab === "now") {
    const locale = appLocale();
    const tick = () => {
      const n = new Date();
      const el = document.getElementById("clk");
      if (!el) return;
      el.textContent = n.toLocaleTimeString(locale, { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true });
      document.getElementById("clkD").textContent = n.toLocaleDateString(locale, { weekday:"long", day:"numeric", month:"long", year:"numeric" });
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const tzEl = document.getElementById("clkTz"); if (tzEl) tzEl.textContent = tz;
      const u = document.getElementById("clkUTC"); if (u) u.textContent = n.toISOString().slice(11,19) + " UTC";
      const t24 = document.getElementById("clk24"); if (t24) t24.textContent = n.toLocaleTimeString(locale, { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });
    };
    tick();
    clockInterval = setInterval(tick, 1000);
  }
  if (clockTab === "stopwatch" && sw.running) {
    if (window._stopwatchInt) clearInterval(window._stopwatchInt);
    window._stopwatchInt = setInterval(() => {
      sw.elapsed = Date.now() - sw.start;
      const el = document.getElementById("swDisplay");
      if (el) el.textContent = formatMs(sw.elapsed);
    }, 50);
  }
  if (clockTab === "timer" && timerState.running) {
    if (window._timerInt) clearInterval(window._timerInt);
    window._timerInt = setInterval(() => {
      if (timerState.left <= 0) {
        timerState.running = false;
        clearInterval(window._timerInt);
        toast("টাইমার শেষ!", "ok");
        try { if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
        render();
        return;
      }
      timerState.left--;
      const mm = Math.floor(timerState.left/60), ss = timerState.left%60;
      const el = document.getElementById("tmDisplay");
      if (el) el.textContent = String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
    }, 1000);
  }
}
function formatMs(ms) {
  const total = Math.floor(ms/10);
  const cs = total % 100;
  const s = Math.floor(total/100) % 60;
  const m = Math.floor(total/6000);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(cs).padStart(2,"0");
}
function swToggle() {
  if (sw.running) {
    sw.running = false;
    sw.elapsed = Date.now() - sw.start;
    if (window._stopwatchInt) clearInterval(window._stopwatchInt);
  } else {
    sw.running = true;
    sw.start = Date.now() - sw.elapsed;
  }
  render();
}
function swLap() {
  if (!sw.running && !sw.elapsed) return;
  const val = sw.running ? Date.now() - sw.start : sw.elapsed;
  sw.laps = sw.laps || [];
  sw.laps.unshift(val);
  if (sw.laps.length > 30) sw.laps.pop();
  render();
}
function swReset() {
  sw = { running: false, start: 0, elapsed: 0, laps: [] };
  if (window._stopwatchInt) clearInterval(window._stopwatchInt);
  render();
}
function timerPreset(m) {
  timerState = { running: false, left: m*60, total: m*60 };
  if (window._timerInt) clearInterval(window._timerInt);
  render();
}
function clockTimerSetCustom() {
  const m = Math.max(0, +document.getElementById("tmMin").value || 0);
  const s = Math.max(0, Math.min(59, +document.getElementById("tmSec").value || 0));
  const total = m*60 + s;
  if (total <= 0) return toast("সময় সেট করুন", "err");
  timerState = { running: false, left: total, total };
  if (window._timerInt) clearInterval(window._timerInt);
  render();
}
function clockTimerToggle() {
  if (timerState.left <= 0) return toast("আগে সময় সেট করুন", "err");
  timerState.running = !timerState.running;
  if (!timerState.running && window._timerInt) clearInterval(window._timerInt);
  render();
}
function clockTimerReset() {
  timerState.running = false;
  timerState.left = timerState.total;
  if (window._timerInt) clearInterval(window._timerInt);
  render();
}

/* ============================================================
   CALCULATOR (Basic + Scientific)
   ============================================================ */
let calcExpr = "";
/** Safe arithmetic only — no Function/eval */
function safeCalc(expr) {
  if (!expr || !/^[0-9+\-*/().\s]+$/.test(expr)) return null;
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    if (/\s/.test(expr[i])) { i++; continue; }
    if ("+-*/()".includes(expr[i])) { tokens.push(expr[i]); i++; continue; }
    if (/[0-9.]/.test(expr[i])) {
      let n = "";
      while (i < expr.length && /[0-9.]/.test(expr[i])) n += expr[i++];
      tokens.push(parseFloat(n));
      continue;
    }
    return null;
  }
  let p = 0;
  function peek() { return tokens[p]; }
  function next() { return tokens[p++]; }
  function parseExpr() {
    let v = parseTerm();
    while (peek() === "+" || peek() === "-") {
      const op = next();
      const r = parseTerm();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  }
  function parseTerm() {
    let v = parseFactor();
    while (peek() === "*" || peek() === "/") {
      const op = next();
      const r = parseFactor();
      v = op === "*" ? v * r : v / r;
    }
    return v;
  }
  function parseFactor() {
    if (peek() === "-") { next(); return -parseFactor(); }
    if (peek() === "+") { next(); return parseFactor(); }
    if (peek() === "(") {
      next();
      const v = parseExpr();
      if (next() !== ")") throw new Error(")");
      return v;
    }
    const n = next();
    if (typeof n !== "number" || isNaN(n)) throw new Error("n");
    return n;
  }
  const result = parseExpr();
  if (p !== tokens.length) throw new Error("t");
  return result;
}
function rCalc(c, tr) {

  c.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr;gap:16px;max-width:720px;margin:0 auto">

      </div>
      <div class="card">
        <div class="section-head"><h3>হিস্টোরি</h3>
          <button class="btn btn-sm btn-danger" onclick="clearCalcHistory()">মুছুন</button>
        </div>
        ${hist.length ? hist.map(h => `
          <div class="item" style="padding:10px 12px;cursor:pointer" onclick="useCalcHistory('${esc(String(h.result))}')">
            <div class="item-body">
              <div class="item-meta">${esc(h.expr)}</div>
              <div class="item-title">= ${esc(String(h.result))}</div>
            </div>
          </div>`).join("") : '<div class="empty" style="padding:20px"><p>এখনো কোনো হিসাব নেই</p></div>'}

function clearCalcHistory() {
  S.calcHistory = [];
  save();
  render();
}
function useCalcHistory(val) {
  calcExpr = String(val);
  const d = document.getElementById("calcD");
  if (d) d.value = calcExpr;
}
function calcFn(k) {
  const d = document.getElementById("calcD");
  if (!d) return;
  if (k === "C") { calcExpr = ""; d.value = "0"; return; }
  if (k === "CE") { calcExpr = ""; d.value = "0"; return; }
  if (k === "⌫") {
    calcExpr = (calcExpr || "").slice(0, -1);
    d.value = calcExpr || "0";
    return;
  }
  if (k === "pi") {
    if (d.value === "0" || d.value === "Error") calcExpr = "";
    calcExpr += String(Math.PI);
    d.value = calcExpr;
    return;
  }
  if (k === "=") {
    try {
      const exprShow = calcExpr;
      let e = calcExpr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
      const r = safeCalc(e);
      if (r === null || !isFinite(r)) throw new Error("bad");
      const rounded = Math.round(r * 1e12) / 1e12;
      d.value = rounded; calcExpr = String(rounded);
      if (!Array.isArray(S.calcHistory)) S.calcHistory = [];
      S.calcHistory.unshift({ expr: exprShow, result: rounded });
      if (S.calcHistory.length > 40) S.calcHistory = S.calcHistory.slice(0, 40);
      save();
    } catch { d.value = "Error"; calcExpr = ""; }
    return;
  }
  if (k === "±") {
    if (calcExpr) { calcExpr = calcExpr.startsWith("-") ? calcExpr.slice(1) : "-" + calcExpr; d.value = calcExpr; }
    return;
  }
  const unary = {
    sqrt: x => Math.sqrt(x),
    sq: x => Math.pow(x, 2),
    inv: x => 1 / x,
    "%": x => x / 100,
    sin: x => Math.sin(x * Math.PI / 180),
    cos: x => Math.cos(x * Math.PI / 180),
    tan: x => Math.tan(x * Math.PI / 180),
    log: x => Math.log10(x)
  };
  if (unary[k]) {
    try {
      const r = unary[k](parseFloat(calcExpr || d.value));
      if (!isFinite(r)) throw new Error("bad");
      const rounded = Math.round(r * 1e12) / 1e12;
      d.value = rounded; calcExpr = String(rounded);
    } catch { d.value = "Error"; calcExpr = ""; }
    return;
  }
  if (d.value === "0" || d.value === "Error") calcExpr = "";
  calcExpr += k;
  d.value = calcExpr;
}

async function saveProfile() {
  try {
    const prev = S.profile || {};
    let avatar = ((document.getElementById("pA") || {}).value || "").trim();
    let cover = ((document.getElementById("pCover") || {}).value || "").trim();
    // Keep existing image if user did not upload a new one / empty URL field
    if (!avatar) avatar = prev.avatar || "";
    if (!cover) cover = prev.cover || "";

    const photoEl = document.getElementById("pPhoto");
    if (photoEl && photoEl.files && photoEl.files[0]) {
      const f = photoEl.files[0];
      if (!f.type || !f.type.startsWith("image/")) {
        toast("প্রোফাইলের জন্য JPG/PNG ছবি দিন — বাকি তথ্য সেভ হচ্ছে", "err");
      } else {
        document.getElementById("saveDot").textContent = "ছবি প্রসেস...";
        let url = null;
        try { url = await uploadToCloud(f, "avatar"); } catch (e) { url = null; }
        if (!url) {
          try { url = await compressImage(f, 400, 0.8); }
          catch (e1) {
            try { url = await readAsDataURL(f, 3e6); }
            catch (e2) { url = null; }
          }
        }
        if (url) {
          avatar = url;
        } else {
          toast("ছবি প্রসেস ব্যর্থ (ফাইল বড় বা করাপ্ট হতে পারে) — বাকি প্রোফাইল তথ্য সেভ হচ্ছে, ছোট ছবি দিয়ে আবার চেষ্টা করুন", "err");
        }
      }
    }

    const coverEl = document.getElementById("pCoverFile");
    if (coverEl && coverEl.files && coverEl.files[0]) {
      const f = coverEl.files[0];
      if (!f.type || !f.type.startsWith("image/")) {
        toast("কভারের জন্য JPG/PNG ছবি দিন — বাকি তথ্য সেভ হচ্ছে", "err");
      } else {
        document.getElementById("saveDot").textContent = "কভার প্রসেস...";
        let url = null;
        try { url = await uploadToCloud(f, "cover"); } catch (e) { url = null; }
        if (!url) {
          try { url = await compressImage(f, 1000, 0.75); }
          catch (e1) {
            try { url = await readAsDataURL(f, 3e6); }
            catch (e2) { url = null; }
          }
        }
        if (url) {
          cover = url;
        } else {
          toast("কভার প্রসেস ব্যর্থ — বাকি প্রোফাইল তথ্য সেভ হচ্ছে", "err");
        }
      }
    }

    const g = id => {
      const el = document.getElementById(id);
      return el && el.value != null ? String(el.value) : "";
    };

    S.profile = {
      name: g("pN").trim() || prev.name || "Omar Faruk",
      title: g("pTitle"),
      company: g("pCompany"),
      bio: g("pB"),
      location: g("pLoc"),
      college: g("pC"),
      subject: g("pS"),
      birthday: g("pBday"),
      blood: g("pBlood"),
      address: g("pAddr"),
      email: g("pE"),
      phone: g("pP"),
      whatsapp: g("pWa"),
      website: g("pWeb"),
      linkedin: g("pLi"),
      github: g("pGh"),
      facebook: g("pFb"),
      skills: g("pSkills"),
      goals: g("pG"),
      avatar,
      cover
    };

    // Immediate local save (not only debounced)
    try {
      S._updatedAt = Date.now();
      localStorage.setItem(KEY, JSON.stringify(S));
      document.getElementById("saveDot").textContent = "✓ লোকাল সেভ";
    } catch (e) {
      console.warn(e);
      // If quota exceeded because of a large image, shrink and retry once
      let recovered = false;
      try {
        if (avatar && String(avatar).startsWith("data:") && avatar.length > 100000) {
          const slim = await compressImage(
            await (await fetch(avatar)).blob().then(b => new File([b], "a.jpg", { type: "image/jpeg" })),
            256, 0.6
          );
          S.profile.avatar = slim;
        }
        if (cover && String(cover).startsWith("data:") && cover.length > 150000) {
          const slimC = await compressImage(
            await (await fetch(cover)).blob().then(b => new File([b], "c.jpg", { type: "image/jpeg" })),
            600, 0.55
          );
          S.profile.cover = slimC;
        }
        localStorage.setItem(KEY, JSON.stringify(S));
        document.getElementById("saveDot").textContent = "✓ লোকাল সেভ";
        recovered = true;
      } catch (e2) {
        recovered = false;
      }
      if (!recovered) {
        // Last resort: drop images entirely so the rest of the profile still saves
        try {
          S.profile.avatar = prev.avatar || "";
          S.profile.cover = prev.cover || "";
          localStorage.setItem(KEY, JSON.stringify(S));
          document.getElementById("saveDot").textContent = "✓ লোকাল সেভ (ছবি বাদে)";
          toast("স্টোরেজ পূর্ণ — বাকি প্রোফাইল সেভ হয়েছে, কিন্তু ছবি সেভ হয়নি। Google লগইন চালু করলে বড় ছবিও সেভ হবে।", "err");
        } catch (e3) {
          toast("সেভ ব্যর্থ — স্টোরেজ সম্পূর্ণ পূর্ণ। সেটিংস থেকে পুরনো ডেটা ব্যাকআপ নিয়ে কিছু মুছে ফেলুন।", "err");
          return;
        }
      }
    }

    updateUser();
    // also trigger normal save (cloud sync if available)
    save();
    toast("প্রোফাইল সেভ হয়েছে ✓", "ok");
    render();
  } catch (err) {
    console.error(err);
    toast("সেভ ব্যর্থ: " + (err.message || "অজানা সমস্যা"), "err");
  }
}

function saveFirebaseConfig() {
  const raw = document.getElementById("fbCfgPaste").value.trim();
  try {
    let obj = JSON.parse(raw);
    // allow paste of full firebase snippet object
    if (!obj.apiKey && obj.firebase) obj = obj.firebase;
    if (!obj.apiKey) return toast("সঠিক config JSON দিন (apiKey লাগবে)", "err");
    localStorage.setItem(FB_CFG_KEY, JSON.stringify(obj));

  } catch (e) {

  }
}

  });
}

  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => toast("কপি হয়েছে", "ok")).catch(() => toast("কপি ব্যর্থ", "err"));
}
async function forceSyncNow() {
  if (!currentUser) return toast("আগে Google লগইন করুন", "err");
  if (!navigator.onLine) return toast("অফলাইন — ইন্টারনেট চালু করুন", "err");
  const dot = document.getElementById("saveDot");
  if (dot) dot.textContent = "সিঙ্ক হচ্ছে...";
  try {
    S._updatedAt = Date.now();
    localStorage.setItem(KEY, JSON.stringify(S));
    await loadCloud({ silent: true });
    const ok = await pushCloud();
    toast(ok ? "✅ সম্পূর্ণ সিঙ্ক হয়েছে — সব ডিভাইসে একই ডেটা" : "সিঙ্ক আংশিক ব্যর্থ", ok ? "ok" : "err");
  } catch (e) {
    toast("সিঙ্ক ব্যর্থ: " + (e.message || ""), "err");
  }
  if (view === "settings") render();
  else if (dot) dot.textContent = lastSyncError ? "⚠ সিঙ্ক সমস্যা" : "✓ ক্লাউড সিঙ্ক";
}
function chgPw() {
  const oldEl = document.getElementById("oldPw");
  const n = (document.getElementById("nwPw") || {}).value || "";
  const n2 = (document.getElementById("nwPw2") || {}).value || "";
  if (oldEl && oldEl.value !== S.pw) return toast("বর্তমান পাসওয়ার্ড ভুল", "err");
  if (n.length < 6) return toast("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর", "err");
  if (document.getElementById("nwPw2") && n !== n2) return toast("নতুন পাসওয়ার্ড মিলছে না", "err");
  S.pw = n; save(); toast("পাসওয়ার্ড পরিবর্তন হয়েছে", "ok");
  if (oldEl) oldEl.value = "";
  const a = document.getElementById("nwPw"); if (a) a.value = "";
  const b = document.getElementById("nwPw2"); if (b) b.value = "";
}
function setTheme(t) {
  applyTheme(t);
  save();
  render();
  toast(t === "dark" ? "ডার্ক থিম" : "লাইট থিম", "ok");
}
function applyDensity() {
  const content = document.getElementById("content");
  if (!content) return;
  if (S.settings.density === "compact") content.style.padding = "14px 14px 90px";
  else content.style.padding = "";
}
function saveSet() {
  const cur = document.getElementById("sCur");
  const week = document.getElementById("sWeek");
  const disp = document.getElementById("sDisp");
  const df = document.getElementById("sDateFmt");
  const fab = document.getElementById("sFab");
  if (cur) S.settings.currency = cur.value || "৳";
  if (week) S.settings.weekStart = +week.value;
  if (disp && disp.value.trim()) S.profile.name = disp.value.trim();
  if (df) S.settings.dateFormat = df.value;
  if (fab) S.settings.fabShow = fab.value === "1";
  updateUser(); save();
  const fabEl = document.getElementById("fab");
  if (fabEl) fabEl.classList.toggle("show", S.settings.fabShow !== false && fabViews.includes(view));
  toast("সেটিংস সেভ হয়েছে", "ok");
  // settings page-এ থেকেই preview আপডেট (sync line ইত্যাদি)
  if (view === "settings") render();
}
function exportData() {
  try {
    S._backupAt = Date.now();
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch(e) {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
  a.download = "omar-command-center-backup-" + today() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("ব্যাকআপ ডাউনলোড — Google Drive-এ তুলে রাখুন", "ok");
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      appConfirm("বর্তমান ডেটা রিপ্লেস হবে। নিশ্চিত?", () => {
        Object.assign(S, data);
        ensureFolders(); save(); updateUser(); render(); toast("ইমপোর্ট সফল", "ok");
      });
    } catch { toast("ভুল JSON ফাইল", "err"); }
  };
  r.readAsText(f);
}
function resetAll() {
  appConfirm("সব লোকাল ডেটা মুছে যাবে। নিশ্চিত?", () => {
    appConfirm("আবার নিশ্চিত করুন — এটি আনডু করা যাবে না।", () => {
      doResetAll();
    });
  });
}
function doResetAll() {
  localStorage.removeItem(KEY);
  location.reload();
}
</script>
</body>
</html>
