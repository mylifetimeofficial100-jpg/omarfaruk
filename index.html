<style>
/* LIGHT — Final Pro */
:root, [data-theme="light"] {
  --bg: #f5f4fb;
  --bg2: #ffffff;
  --sidebar: #fbfafe;
  --card: #ffffff;
  --card2: #f3f1fa;
  --border: #e6e2f0;
  --border2: #d4cfe3;
  --text: #14121f;
  --text2: #5c5670;
  --text3: #908aa3;
  --accent: #6d5efc;
  --accent2: #a78bfa;
  --accent-soft: rgba(109,94,252,.12);
  --green: #10b981;
  --green-soft: rgba(16,185,129,.12);
  --red: #ef4444;
  --red-soft: rgba(239,68,68,.1);
  --orange: #f59e0b;
  --orange-soft: rgba(245,158,11,.12);
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 4px 20px rgba(40,30,80,.06), 0 1px 3px rgba(40,30,80,.04);
  --shadow-lg: 0 16px 48px rgba(40,30,80,.12), 0 4px 12px rgba(40,30,80,.06);
  --input-bg: #f7f5fc;
  --gate-bg: #f0eef8;
  --overlay: rgba(20,18,35,.4);
  --grad: linear-gradient(135deg, #6d5efc 0%, #8b5cf6 45%, #a78bfa 100%);
  --grad-soft: linear-gradient(135deg, rgba(109,94,252,.08), rgba(167,139,250,.06));
}
/* DARK — Final Pro */
[data-theme="dark"] {
  --bg: #0b0a10;
  --bg2: #12111a;
  --sidebar: #0e0d15;
  --card: #16151f;
  --card2: #1c1b28;
  --border: #2a2838;
  --border2: #3a374c;
  --text: #f4f2fb;
  --text2: #a29bb8;
  --text3: #6e6884;
  --accent: #8b7cf7;
  --accent2: #c4b5fd;
  --accent-soft: rgba(139,124,247,.16);
  --green: #34d399;
  --green-soft: rgba(52,211,153,.14);
  --red: #f87171;
  --red-soft: rgba(248,113,113,.14);
  --orange: #fbbf24;
  --orange-soft: rgba(251,191,36,.14);
  --shadow: 0 8px 32px rgba(0,0,0,.45);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.55);
  --input-bg: rgba(0,0,0,.28);
  --gate-bg: #0b0a10;
  --overlay: rgba(0,0,0,.65);
  --grad: linear-gradient(135deg, #7c6df0 0%, #9b7ef5 45%, #c4b5fd 100%);
  --grad-soft: linear-gradient(135deg, rgba(139,124,247,.12), rgba(196,181,253,.06));
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::-webkit-scrollbar-track { background: transparent; }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #3f3b52; }

/* ========== GATE ========== */
#gate {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: var(--gate-bg);
}
#gate::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(109,94,252,.12) 0%, transparent 60%);
}
.gate-card {
  position: relative; z-index: 1;
  width: 100%; max-width: 380px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 28px 32px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.gate-logo {
  width: 56px; height: 56px; margin: 0 auto 16px;
  background: var(--grad);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 800; color: #fff;
  box-shadow: 0 8px 20px rgba(109,94,252,.28);
}
.gate-card h1 {
  font-size: 22px; font-weight: 700; margin-bottom: 4px;
  letter-spacing: -.3px; color: var(--text);
}
.gate-card .sub {
  color: var(--text3); font-size: 13.5px; margin-bottom: 28px;
}
.gate-card input {
  width: 100%; padding: 13px 44px 13px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--input-bg);
  font-size: 15px; outline: none; color: var(--text);
  transition: border .2s, box-shadow .2s;
}
.gate-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(109,94,252,.14);
  background: var(--bg2);
}
.gate-pw-wrap { position: relative; margin-bottom: 12px; }
.gate-pw-eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border: none; background: none;
  cursor: pointer; font-size: 15px; color: var(--text3); border-radius: 8px;
}
.gate-pw-eye:hover { color: var(--text); background: var(--card2); }
.gate-card .btn-main {
  width: 100%; padding: 13px; border: none; border-radius: 12px;
  background: var(--grad); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; box-shadow: 0 6px 18px rgba(109,94,252,.28);
  transition: transform .15s, box-shadow .15s;
}
.gate-card .btn-main:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(109,94,252,.36); }
.gate-card .btn-google {
  width: 100%; padding: 12px; border-radius: 12px; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); font-size: 14.5px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background .15s, border-color .15s;
  margin-bottom: 14px;
}
.gate-card .btn-google:hover { background: var(--card2); border-color: var(--border2); }
.gate-or {
  display: flex; align-items: center; gap: 12px;
  margin: 0 0 14px; color: var(--text3); font-size: 12px;
}
.gate-or::before, .gate-or::after {
  content: ""; flex: 1; height: 1px; background: var(--border);
}
#gateErr { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
#gateHint { margin-top: 14px; font-size: 12px; color: var(--text3); line-height: 1.5; }

/* ========== APP SHELL ========== */
#app { display: none; height: 100vh; }
.shell { display: flex; height: 100%; }

/* Sidebar */
#sidebar {
  width: 272px; flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  z-index: 100;
  box-shadow: 2px 0 16px rgba(26,29,38,.03);
}
.sb-top {
  padding: 22px 18px 16px;
  display: flex; align-items: center; gap: 13px;
}
.sb-logo {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0;
  box-shadow: 0 6px 18px rgba(109,94,252,.3);
}
.sb-title { font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; color: var(--text); line-height: 1.25; }
.sb-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

.sb-nav { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.nav-label {
  font-size: 10.5px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .8px;
  padding: 16px 12px 7px;
}
.nav-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 13px; border-radius: 12px;
  cursor: pointer; color: var(--text2); font-size: 14.5px;
  transition: all .15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
}
.nav-btn:hover { background: var(--card2); color: var(--text); }
.nav-btn.active {
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
  box-shadow: inset 3px 0 0 var(--accent);
}
.nav-btn .ico { width: 22px; text-align: center; font-size: 17px; flex-shrink: 0; }

.sb-bottom {
  padding: 12px; border-top: 1px solid var(--border);
}
.user-pill {
  display: flex; align-items: center; gap: 11px;
  padding: 10px; border-radius: 13px; cursor: pointer;
  transition: background .15s;
}
.user-pill:hover { background: var(--card2); }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; color: #fff; overflow: hidden; flex-shrink: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { flex: 1; min-width: 0; }
.user-meta .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.user-meta .rl { font-size: 11px; color: var(--text3); }

#overlay {
  display: none; position: fixed; inset: 0;
  background: var(--overlay); z-index: 90;
}

/* Main area */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg); }
#topbar {
  height: 60px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter: blur(20px) saturate(1.2);
  position: relative;
}
#burger {
  display: none; background: none; border: none;
  color: var(--text); font-size: 22px; cursor: pointer; padding: 6px;
}
#pageTitle { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; letter-spacing: -.25px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topRight { display: flex; align-items: center; gap: 8px; }
#saveDot {
  font-size: 12px; color: var(--text3); margin-right: 4px;
}
#searchWrap { display: flex; align-items: center; gap: 6px; max-width: 260px; flex: 1; margin: 0 4px; }
#searchWrap .input { width: 100%; }
#searchToggle { display: none; background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px; color: var(--text); }
@media (max-width: 720px) {
  #searchWrap { display: none; position: absolute; left: 48px; right: 12px; top: 58px; max-width: none; z-index: 70;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px; box-shadow: var(--shadow); }
  #searchWrap.open { display: flex; }
  #searchToggle { display: inline-flex; }
  #netBadge { display: none; }
  #saveDot { display: none; }
}

#content {
  flex: 1; overflow-y: auto;
  padding: 24px 26px 110px;
  background: var(--bg);
}

/* ========== SHARED UI ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: all .15s; white-space: nowrap; color: var(--text);
}
.btn:hover { background: var(--card2); border-color: var(--border2); }
.btn-primary {
  background: var(--grad);
  border: none; color: #fff; font-weight: 600;
  box-shadow: 0 6px 20px rgba(109,94,252,.3);
  letter-spacing: .01em;
}
.btn-primary:hover { opacity: .96; transform: translateY(-1.5px); box-shadow: 0 10px 28px rgba(109,94,252,.4); }
.btn-danger { color: var(--red); border-color: rgba(240,68,56,.25); }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn-lg { padding: 13px 22px; font-size: 15px; border-radius: 13px; }
.btn-icon {
  width: 40px; height: 40px; padding: 0; border-radius: 12px;
  font-size: 18px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: border-color .15s, box-shadow .2s, transform .15s;
}
.card-hover:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 18px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  transition: transform .15s, box-shadow .2s;
}
.stat-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad); opacity: .85;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-label { font-size: 12px; color: var(--text3); margin-bottom: 8px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }
.stat-num { font-size: 28px; font-weight: 800; letter-spacing: -.8px; color: var(--text); }
.stat-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-head h3 { font-size: 13.5px; font-weight: 600; color: var(--text2); letter-spacing: .2px; }

.form-group { margin-bottom: 15px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text3); margin-bottom: 7px;
}
.input, .select, .textarea {
  width: 100%; padding: 12px 14px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--input-bg);
  font-size: 14.5px; outline: none; transition: border .2s, box-shadow .2s; color: var(--text);
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(109,94,252,.15);
  background: var(--bg2);
}
.textarea { min-height: 90px; resize: vertical; }

.badge {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 99px;
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
}
.b-blue { background: var(--accent-soft); color: var(--accent); }
.b-green { background: var(--green-soft); color: var(--green); }
.b-red { background: var(--red-soft); color: var(--red); }
.b-orange { background: var(--orange-soft); color: var(--orange); }

.empty {
  text-align: center; padding: 56px 20px; color: var(--text3);
}
.empty .big { font-size: 52px; margin-bottom: 14px; opacity: .5; }
.empty p { font-size: 14.5px; margin-bottom: 20px; }

/* List items */
.item {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 15px; border-radius: 13px;
  background: var(--card); border: 1px solid var(--border);
  margin-bottom: 8px; transition: background .15s, border-color .15s;
  box-shadow: var(--shadow);
}
.item:hover { background: var(--card2); border-color: var(--border2); }
.item.done .item-title { text-decoration: line-through; color: var(--text3); }
.item-check { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 14.5px; font-weight: 500; color: var(--text); }
.item-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }

/* Modal */
.modal-back {
  position: fixed; inset: 0; background: var(--overlay);
  z-index: 500; display: none; align-items: center; justify-content: center;
  padding: 16px; backdrop-filter: blur(4px);
}
.modal-back.show { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px; width: 100%; max-width: 460px;
  max-height: 88vh; overflow-y: auto; padding: 28px;
  box-shadow: var(--shadow-lg);
  color: var(--text);
}
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; letter-spacing: -.2px; color: var(--text); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* FAB */
#fab {
  position: fixed; bottom: 28px; right: 28px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--grad);
  color: #fff; border: none; font-size: 30px;
  cursor: pointer; box-shadow: 0 10px 32px rgba(109,94,252,.38);
  z-index: 40; display: none; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
}
#fab.show { display: flex; }
#fab:hover { transform: scale(1.07); box-shadow: 0 12px 36px rgba(109,94,252,.45); }

#toastWrap {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  width: min(400px, 92vw);
}
.toast {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow-lg);
  font-size: 13.5px; animation: toastIn .25s ease;
  display: flex; align-items: center; gap: 10px;
}
.toast.ok { border-left: 3px solid var(--green); }
.toast.err { border-left: 3px solid var(--red); }
.toast.info { border-left: 3px solid var(--accent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.folder-row {
  display: flex; align-items: center; gap: 6px; padding: 8px 10px 4px;
  font-size: 11.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .4px;
}
#searchPanel {
  display: none; position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
  width: min(420px, 94vw); max-height: min(60vh, 420px); overflow-y: auto;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg); z-index: 80; padding: 8px;
}
#searchPanel.show { display: block; }
#timerPill {
  display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  white-space: nowrap; cursor: pointer;
}
#timerPill.show { display: inline-flex; }
#netBadge {
  font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px;
  white-space: nowrap;
}
#netBadge.online { background: var(--green-soft); color: var(--green); }
#netBadge.offline { background: var(--orange-soft); color: var(--orange); }
.habit-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.habit-scroll .habit-row { min-width: 420px; }
.block-wrap.dragging { opacity: .45; }
.block-wrap.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
.money-bar-wrap { display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-top: 12px; }
.money-bar {
  flex: 1; background: var(--accent-soft); border-radius: 6px 6px 0 0;
  min-height: 4px; position: relative; transition: height .2s;
}
.money-bar.out { background: var(--red-soft); }
.port-cover {
  width: 100%; height: 120px; object-fit: cover; border-radius: 12px;
  margin-bottom: 10px; background: var(--card2);
}
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.search-hit {
  padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13.5px;
}
.search-hit:hover { background: var(--card2); }
.search-hit .meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
#onboardBanner {
  background: linear-gradient(135deg, rgba(59,125,255,.12), rgba(108,92,231,.1));
  border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px;
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
}
#uploadBar {
  display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1000;
  background: transparent;
}
#uploadBar .fill {
  height: 100%; width: 0%; background: var(--grad);
  transition: width .2s;
}

/* ========== DASHBOARD ========== */
.greet { margin-bottom: 28px; }
.greet h1 { font-size: 27px; font-weight: 700; letter-spacing: -.4px; }
.greet p { color: var(--text2); font-size: 14.5px; margin-top: 5px; }

/* Home Notepad + Todo */
.home-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
@media (max-width: 860px) { .home-duo { grid-template-columns: 1fr; } }
.home-panel {

}

}

}

.block {
  position: relative;

}

}

.block-tools {

/* Table */
.tbl-wrap { overflow-x: auto; }

.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

/** Upload file to Firebase Storage (Google cloud). Returns download URL or null */
async function uploadToCloud(file, folder) {
  if (!useCloud || !storage || !currentUser) return null;
  try {
    const path = `users/${currentUser.uid}/${folder || "files"}/${Date.now()}_${file.name}`;
    const ref = storage.ref().child(path);
    showUpload(10);
    const task = ref.put(file);
    task.on("state_changed", snap => {
      if (snap.totalBytes) showUpload(Math.round(snap.bytesTransferred / snap.totalBytes * 100));
    });
    await task;
    showUpload(100);
    return await ref.getDownloadURL();
  } catch (e) {
    console.warn("Storage upload failed", e);
    showUpload(100);
    return null;
  }
}

/** Read small file as base64 (local fallback) */
function readAsDataURL(file, maxBytes) {
  return new Promise((resolve, reject) => {
    if (maxBytes && file.size > maxBytes) return reject(new Error("ফাইল বড়"));
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function loadCloud() {
  if (!useCloud || !db || !currentUser) return;
  try {
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      const data = doc.data();
      const { pw, ...rest } = data;
      const cloudTime = rest._updatedAt || 0;
      const localRaw = localStorage.getItem(KEY);
      let localTime = 0;
      try { if (localRaw) localTime = JSON.parse(localRaw)._updatedAt || 0; } catch(e) {}
      // Cloud wins if newer or equal; always prefer cloud after Google login for consistency
      Object.assign(S, rest);
      ensureFolders();
      localStorage.setItem(KEY, JSON.stringify(S));
      lastSyncAt = new Date();
      lastSyncError = null;
      if (cloudTime && localTime && cloudTime < localTime) {

function esc(s) { return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtMoney(n) {
  n = +n || 0;
  const neg = n < 0;
  const parts = Math.abs(n).toFixed(2).split(".");
  let intPart = parts[0];
  // South-Asian (lakh/crore) style grouping: last 3 digits, then groups of 2
  let out = intPart.slice(-3);
  let rest = intPart.slice(0, -3);
  while (rest.length > 0) {
    out = rest.slice(-2) + "," + out;
    rest = rest.slice(0, -2);
  }
  const dec = parts[1] === "00" ? "" : "." + parts[1];
  return (neg ? "-" : "") + out + dec;
}

function onGlobalSearch(q) {
  const panel = document.getElementById("searchPanel");
  if (!panel) return;
  q = (q || "").trim().toLowerCase();
  if (!q) { panel.classList.remove("show"); panel.innerHTML = ""; return; }
  const hits = [];
  S.pages.forEach(p => {
    if ((p.title || "").toLowerCase().includes(q)) hits.push({ type: "পেজ", title: p.title || "শিরোনামহীন", go: () => { S.currentPage = p.id; go("work"); } });
    (p.blocks || []).forEach(b => {
      const text = (b.content || "") + (b.items || []).map(i => i.text || "").join(" ");
      if (text.toLowerCase().includes(q)) hits.push({ type: "পেজ কন্টেন্ট", title: (p.title || "") + " — " + text.slice(0, 40), go: () => { S.currentPage = p.id; go("work"); } });
    });
  });
  S.tasks.forEach(t => {
    if ((t.title || "").toLowerCase().includes(q) || (t.note || "").toLowerCase().includes(q))
      hits.push({ type: "টাস্ক", title: t.title, go: () => go("tasks") });
  });
  S.projects.forEach(p => {
    if ((p.name || "").toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q))
      hits.push({ type: "প্রজেক্ট", title: p.name, go: () => go("projects") });
  });
  S.events.forEach(e => {
    if ((e.title || "").toLowerCase().includes(q))
      hits.push({ type: "ইভেন্ট", title: e.title + " (" + (e.date || "") + ")", go: () => go("cal") });
  });
  S.txs.forEach(t => {
    if ((t.title || "").toLowerCase().includes(q) || (t.cat || "").toLowerCase().includes(q))
      hits.push({ type: "লেনদেন", title: t.title, go: () => go("money") });
  });
  S.files.forEach(f => {
    if ((f.name || "").toLowerCase().includes(q))
      hits.push({ type: "ফাইল", title: f.name, go: () => go("files") });
  });
  if (!hits.length) {
    panel.innerHTML = '<div style="padding:16px;color:var(--text3);font-size:13px;text-align:center">কিছু পাওয়া যায়নি</div>';
  } else {
    panel.innerHTML = hits.slice(0, 20).map((h, i) =>
      `<div class="search-hit" data-i="${i}"><div>${esc(h.title)}</div><div class="meta">${h.type}</div></div>`
    ).join("");
    panel.querySelectorAll(".search-hit").forEach((el, i) => {
      el.onclick = () => { panel.classList.remove("show"); hits[i].go(); };
    });
  }
  panel.classList.add("show");
}

function homeTodoListHTML() {
  const f = window._todoFilter || "open";
  let list = S.tasks.slice();
  if (f === "open") list = list.filter(t => !t.done);
  else if (f === "done") list = list.filter(t => t.done);
  list.sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    const rank = { high: 0, med: 1, low: 2, "": 3 };
    return (rank[a.pri || ""] ?? 3) - (rank[b.pri || ""] ?? 3);
  });
  list = list.slice(0, 12);
  if (!list.length) {
    return `<div class="empty" style="padding:36px 16px"><p style="font-size:14px">${f === "done" ? "সম্পন্ন কাজ নেই" : "কোনো কাজ নেই — উপরে যোগ করুন"}</p></div>`;
  }
  const td = today();
  return list.map(t => {
    const overdue = !t.done && t.due && t.due < td;
    const isToday = t.due === td;
    return `
      <div class="todo-item-h ${t.done ? "done" : ""}">
        <input type="checkbox" ${t.done ? "checked" : ""} onchange="togTask('${t.id}')">
        <div style="flex:1;min-width:0">
          <div class="todo-t">${esc(t.title)}</div>
          <div class="todo-m">
            ${t.pri ? `<span><span class="pri-dot ${t.pri}"></span> ${t.pri}</span>` : ""}
            ${t.due ? `<span style="color:${overdue ? "var(--red)" : isToday ? "var(--accent)" : "var(--text3)"}">📅 ${t.due}${overdue ? " · ওভারডিউ" : isToday ? " · আজ" : ""}</span>` : ""}
            ${t.project || t.projectId ? `<span>📁 ${esc(t.project || projectName(t.projectId) || "")}</span>` : ""}
          </div>
        </div>
        <div class="todo-acts">
          <button class="btn btn-sm" onclick="openTask('${t.id}')" title="এডিট">✎</button>
          <button class="btn btn-sm btn-danger" onclick="delTask('${t.id}')" title="মুছুন">✕</button>
        </div>
      </div>`;
  }).join("");
}
function quickAddTodo() {
  const inp = document.getElementById("homeTodoInput");
  if (!inp) return;
  const title = inp.value.trim();
  if (!title) return toast("কাজের নাম লিখুন", "err");
  S.tasks.push({
    id: uid(), title, pri: "", due: today(), projectId: "", project: "", note: "", done: false, created: Date.now()
  });
  inp.value = "";
  save();
  toast("টাস্ক যোগ হয়েছে", "ok");
  if (view === "dash") render();
  else go("dash");
}
function clearNotepad() {
  appConfirm("নোটপ্যাড খালি করবেন?", () => {
    S.notepad = { content: "", updated: Date.now() };

    toast("নোটপ্যাড খালি", "info");

  });

function todayTasks() {
  const td = today();
  const list = S.tasks.filter(t => !t.done && (!t.due || t.due === td || t.due < td)).slice(0,5);
  if (!list.length) return '<div class="empty" style="padding:28px"><p>আজকের কোনো টাস্ক নেই 🎉</p></div>';
  return list.map(t => `
    <div class="item ${t.done?"done":""}" style="margin-bottom:6px;padding:10px 12px">
      <input type="checkbox" class="item-check" ${t.done?"checked":""} onchange="togTask('${t.id}')">
      <div class="item-body"><div class="item-title">${esc(t.title)}</div></div>
      ${t.pri?`<span class="badge b-${t.pri==="high"?"red":t.pri==="med"?"orange":"green"}">${t.pri}</span>`:""}
    </div>
  `).join("");
}
function dashEvents() {
  const up = S.events.filter(e => e.date >= today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if (!up.length) return '<div class="empty" style="padding:20px"><p>কোনো আসন্ন ইভেন্ট নেই</p></div>';
  return up.map(e => `
    <div class="item" style="padding:10px 12px;margin-bottom:4px">
      <div class="item-body">
        <div class="item-title">${esc(e.title)}</div>
        <div class="item-meta">${e.date} ${e.time||""}</div>
      </div>
    </div>
  `).join("");
}
function dashHabits() {
  if (!S.habits.length) return '<div class="empty" style="padding:20px"><p>হ্যাবিট নেই</p></div>';
  const td = today();
  return S.habits.map(h => {
    const on = (h.logs||[]).includes(td);
    return `
      <div class="item" style="padding:10px 12px;margin-bottom:4px;cursor:pointer" onclick="togHabit('${h.id}','${td}')">
        <div class="item-body"><div class="item-title">${on?"✅":"⬜"} ${esc(h.name)}</div></div>
        <span class="badge b-green">${streakOf(h)}d</span>
      </div>
    `;
  }).join("");
}
function bestStreak() {
  let b = 0;

          <button class="btn btn-sm" onclick="addBlock('video')">🎬 ভিডিও</button>

  `;

  // restore search focus cursor at end if typing

    sEl.focus();
    const len = sEl.value.length;
    try { sEl.setSelectionRange(len, len); } catch(e) {}
  }
}

function drawBlocks(blocks) {
  const el = document.getElementById("blocks");
  if (!el) return;
  el.innerHTML = "";
  blocks.forEach((b, i) => el.appendChild(makeBlock(b, i)));
}

function makeBlock(b, i) {
  const w = document.createElement("div");
  w.className = "block";
  const labels = { text:"টেক্সট", heading:"হেডিং", todo:"টু-ডু", table:"টেবিল", image:"ইমেজ", video:"ভিডিও", audio:"অডিও", file:"ফাইল", link:"লিংক", callout:"নোট", code:"কোড", divider:"ডিভাইডার" };
  // Drop target on whole block; drag only from handle
  w.ondragover = e => { e.preventDefault(); w.classList.add("drag-over"); };
  w.ondragleave = () => w.classList.remove("drag-over");
  w.ondrop = e => {
    e.preventDefault();
    w.classList.remove("drag-over");
    if (dragBlockIdx === null || dragBlockIdx === i) return;
    const p = S.pages.find(x => x.id === S.currentPage);
    if (!p || !p.blocks) return;
    const [moved] = p.blocks.splice(dragBlockIdx, 1);
    p.blocks.splice(i, 0, moved);
    dragBlockIdx = null;
    drawBlocks(p.blocks); save();
  };

  const bar = document.createElement("div");
  bar.className = "block-bar";
  const handle = document.createElement("span");
  handle.className = "block-label";
  handle.style.cssText = "cursor:grab;user-select:none";
  handle.draggable = true;
  handle.textContent = "⠿ " + (labels[b.type] || b.type);
  handle.title = "টেনে সরান";
  handle.ondragstart = e => {
    dragBlockIdx = i;
    w.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(i));
  };
  handle.ondragend = () => {
    dragBlockIdx = null;
    w.classList.remove("dragging");
    document.querySelectorAll(".block.drag-over, .block-wrap.drag-over").forEach(el => el.classList.remove("drag-over"));
  };
  bar.appendChild(handle);
  const acts = document.createElement("div");
  acts.className = "block-acts";
  const up = document.createElement("button");
  up.className = "block-x"; up.textContent = "↑"; up.title = "উপরে";
  up.onclick = () => moveBlock(i, -1);
  const dn = document.createElement("button");
  dn.className = "block-x"; dn.textContent = "↓"; dn.title = "নিচে";
  dn.onclick = () => moveBlock(i, 1);
  const x = document.createElement("button");
  x.className = "block-x danger"; x.textContent = "✕"; x.title = "মুছুন";
  x.onclick = () => {
    const p = S.pages.find(x => x.id === S.currentPage);
    p.blocks.splice(i,1); drawBlocks(p.blocks); save();
  };
  acts.append(up, dn, x);
  bar.appendChild(acts);
  w.appendChild(bar);

  if (b.type === "text" || b.type === "callout" || b.type === "code") {
    const ta = document.createElement("textarea");
    ta.className = "block-ta";
    if (b.type === "callout") {
      ta.style.borderLeft = "3px solid var(--accent)";
      ta.style.paddingLeft = "12px";
      ta.style.background = "var(--accent-soft)";
      ta.style.borderRadius = "0 8px 8px 0";
      ta.style.padding = "10px 12px";
    }
    if (b.type === "code") {
      ta.style.fontFamily = "ui-monospace, SFMono-Regular, Menlo, monospace";
      ta.style.fontSize = "13px";
      ta.style.background = "var(--bg2)";
      ta.style.borderRadius = "8px";
      ta.style.padding = "12px";
      ta.style.border = "1px solid var(--border)";
    }
    ta.value = b.content || "";
    ta.placeholder = b.type === "code" ? "// কোড লিখুন..." : (b.type === "callout" ? "গুরুত্বপূর্ণ নোট..." : "লিখতে শুরু করুন...");
    ta.oninput = () => { b.content = ta.value; save(); };
    // auto-grow
    ta.style.overflow = "hidden";
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(56, ta.scrollHeight) + "px"; };
    ta.addEventListener("input", grow);
    setTimeout(grow, 0);
    w.appendChild(ta);
  }
  if (b.type === "heading") {
    const inp = document.createElement("input");
    inp.className = "input";
    inp.style.cssText = "font-size:22px;font-weight:700;border:none;background:transparent;padding:4px 0;box-shadow:none";
    inp.value = b.content || "";
    inp.placeholder = "হেডিং...";
    inp.oninput = () => { b.content = inp.value; save(); };
    w.appendChild(inp);
  }
  if (b.type === "todo") {
    const list = document.createElement("div");
    (b.items || []).forEach((it, j) => {
      const row = document.createElement("div");
      row.className = "todo-line" + (it.done ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!it.done;
      cb.onchange = () => { it.done = cb.checked; row.classList.toggle("done", it.done); save(); };
      const tx = document.createElement("input");
      tx.type = "text"; tx.value = it.text || ""; tx.placeholder = "কাজ...";
      tx.oninput = () => { it.text = tx.value; save(); };
      const rm = document.createElement("button");
      rm.textContent = "✕"; rm.style.cssText = "background:none;border:none;color:var(--text3);cursor:pointer";
      rm.onclick = () => { b.items.splice(j,1); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); save(); };
      row.append(cb, tx, rm);
      list.appendChild(row);
    });
    w.appendChild(list);
    const add = document.createElement("button");
    add.className = "add-line"; add.textContent = "+ নতুন কাজ";
    add.onclick = () => {
      b.items = b.items || [];
      b.items.push({ text:"", done:false });
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); save();
    };
    w.appendChild(add);
  }
  if (b.type === "table") {
    b.rows = b.rows || [["কলাম ১","কলাম ২"],["",""]];
    const tw = document.createElement("div"); tw.className = "tbl-wrap";
    const tb = document.createElement("table"); tb.className = "mini";
    b.rows.forEach((row, ri) => {
      const tr = document.createElement("tr");
      row.forEach((cell, ci) => {
        const td = document.createElement(ri===0?"th":"td");
        const inp = document.createElement("input");
        inp.value = cell;
        inp.oninput = () => { b.rows[ri][ci] = inp.value; save(); };
        td.appendChild(inp); tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tw.appendChild(tb); w.appendChild(tw);
    const acts = document.createElement("div");
    acts.style.cssText = "display:flex;gap:8px;margin-top:8px";
    acts.innerHTML = `
      <button class="btn btn-sm" onclick="(function(){const p=S.pages.find(x=>x.id===S.currentPage);const bl=p.blocks[${i}];bl.rows.push(new Array(bl.rows[0].length).fill(''));drawBlocks(p.blocks);save()})()">+ সারি</button>
      <button class="btn btn-sm" onclick="(function(){const p=S.pages.find(x=>x.id===S.currentPage);const bl=p.blocks[${i}];bl.rows.forEach((r,ri)=>r.push(ri===0?'নতুন':''));drawBlocks(p.blocks);save()})()">+ কলাম</button>
    `;
    w.appendChild(acts);
  }
  if (b.type === "image") {
    const inp = document.createElement("input");
    inp.className = "input"; inp.placeholder = "ইমেজ URL...";
    inp.value = b.url || "";
    inp.oninput = () => { b.url = inp.value; save(); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); };
    w.appendChild(inp);
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "image/*"; fi.style.marginTop = "8px";
    fi.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("saveDot").textContent = "আপলোড...";
      let url = await uploadToCloud(f, "workspace");
      if (!url) {
        if (f.size > 1.8e6) return toast("১.৮MB এর ছোট ইমেজ দিন অথবা Google লগইন করুন", "err");
        try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
      }
      b.url = url; save();
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks);
      toast("ইমেজ যোগ হয়েছে", "ok");
    };
    w.appendChild(fi);
    if (b.url) {
      const img = document.createElement("img");
      img.src = b.url; img.className = "media-img";
      img.onerror = () => img.style.display = "none";
      w.appendChild(img);
    }
  }
  if (b.type === "video") {
    const inp = document.createElement("input");
    inp.className = "input"; inp.placeholder = "YouTube / ভিডিও URL...";
    inp.value = b.url || "";
    inp.oninput = () => { b.url = inp.value; save(); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); };
    w.appendChild(inp);
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "video/*"; fi.style.marginTop = "8px";
    fi.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("saveDot").textContent = "আপলোড...";
      let url = await uploadToCloud(f, "workspace");
      if (!url) {
        if (f.size > 1.8e6) return toast("ক্লাউড ছাড়া বড় ভিডিও রাখা যায় না — Google লগইন করুন", "err");
        try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
      }
      b.url = url; save();
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks);
      toast("ভিডিও যোগ হয়েছে", "ok");
    };
    w.appendChild(fi);
    if (b.url) {
      let src = b.url;
      const yt = b.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
      if (yt) {
        src = `https://www.youtube.com/embed/${yt[1]}`;
        const ifr = document.createElement("iframe");
        ifr.src = src; ifr.className = "media-vid";
        ifr.allow = "accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture";
        ifr.allowFullscreen = true;
        w.appendChild(ifr);
      } else {
        const vid = document.createElement("video");
        vid.src = b.url; vid.controls = true; vid.className = "media-vid";
        w.appendChild(vid);
      }
    }
  }
  if (b.type === "audio") {
    const inp = document.createElement("input");
    inp.className = "input"; inp.placeholder = "অডিও URL...";
    inp.value = b.url || "";
    inp.oninput = () => { b.url = inp.value; save(); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); };
    w.appendChild(inp);
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "audio/*"; fi.style.marginTop = "8px";
    fi.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("saveDot").textContent = "আপলোড...";
      let url = await uploadToCloud(f, "workspace");
      if (!url) {
        if (f.size > 1.8e6) return toast("ক্লাউড ছাড়া বড় অডিও রাখা যায় না — Google লগইন করুন", "err");
        try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
      }
      b.url = url; save();
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks);
      toast("অডিও যোগ হয়েছে", "ok");
    };
    w.appendChild(fi);
    if (b.url) {
      const au = document.createElement("audio");
      au.controls = true; au.src = b.url; au.style.width = "100%"; au.style.marginTop = "8px";
      w.appendChild(au);
    }
  }
  if (b.type === "file" || b.type === "link") {
    const n = document.createElement("input");
    n.className = "input"; n.placeholder = b.type==="link" ? "লিংকের নাম" : "ফাইলের নাম (PDF ইত্যাদি)";
    n.value = b.name || ""; n.oninput = () => { b.name = n.value; save(); };
    w.appendChild(n);
    const u = document.createElement("input");
    u.className = "input"; u.style.marginTop = "6px";
    u.placeholder = "URL..."; u.value = b.url || "";
    u.oninput = () => { b.url = u.value; save(); };
    w.appendChild(u);
    if (b.url) {
      const a = document.createElement("a");
      a.href = b.url; a.target = "_blank"; a.className = "file-link";
      a.textContent = (b.type==="link"?"🔗 ":"📥 ") + (b.name || "খুলুন");
      w.appendChild(a);
    }
  }
  if (b.type === "divider") {
    const hr = document.createElement("hr");
    hr.style.cssText = "border:none;border-top:1px solid var(--border);margin:6px 0";
    w.appendChild(hr);
  }
  return w;
}

function addBlock(type) {
  const p = S.pages.find(x => x.id === S.currentPage);
  if (!p) return;
  p.blocks = p.blocks || [];
  const b = { type };
  if (["text","heading","callout","code"].includes(type)) b.content = "";
  if (type === "todo") b.items = [];
  if (type === "table") b.rows = [["কলাম ১","কলাম ২"],["",""]];
  if (["image","video","audio","file","link"].includes(type)) b.url = "";
  if (["file","link"].includes(type)) b.name = "";
  p.blocks.push(b);
  drawBlocks(p.blocks); save();
}
function moveBlock(idx, dir) {
  const p = S.pages.find(x => x.id === S.currentPage);
  if (!p || !p.blocks) return;
  const j = idx + dir;
  if (j < 0 || j >= p.blocks.length) return;
  const tmp = p.blocks[idx];
  p.blocks[idx] = p.blocks[j];
  p.blocks[j] = tmp;
  drawBlocks(p.blocks); save();
}

function rTasks(c, tr) {
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openTask()">+ টাস্ক</button>`;
  let list = S.tasks.slice();
  if (taskFilter.status === "open") list = list.filter(t => !t.done);
  else if (taskFilter.status === "done") list = list.filter(t => t.done);
  if (taskFilter.sort === "due") list.sort((a,b) => (a.due||"9999").localeCompare(b.due||"9999"));
  else if (taskFilter.sort === "pri") {
    const rank = { high: 0, med: 1, low: 2, "": 3 };
    list.sort((a,b) => (rank[a.pri||""]??3) - (rank[b.pri||""]??3));
  } else if (taskFilter.sort === "alpha") list.sort((a,b) => (a.title||"").localeCompare(b.title||"", "bn"));

  const overdue = list.filter(t => !t.done && t.due && t.due < today());
  const todayL = list.filter(t => !t.done && t.due === today());
  const later = list.filter(t => !t.done && (!t.due || t.due > today()));
  const doneL = list.filter(t => t.done);

  c.innerHTML = `
    <div class="filter-row">
      <select class="select" style="width:auto" onchange="taskFilter.status=this.value;render()">
        <option value="open" ${taskFilter.status==="open"?"selected":""}>চলমান</option>
        <option value="done" ${taskFilter.status==="done"?"selected":""}>সম্পন্ন</option>
        <option value="all" ${taskFilter.status==="all"?"selected":""}>সব</option>
      </select>
      <select class="select" style="width:auto" onchange="taskFilter.sort=this.value;render()">
        <option value="due" ${taskFilter.sort==="due"?"selected":""}>ডেডলাইন</option>
        <option value="pri" ${taskFilter.sort==="pri"?"selected":""}>প্রায়োরিটি</option>
        <option value="alpha" ${taskFilter.sort==="alpha"?"selected":""}>নাম</option>
      </select>
    </div>
    ${taskFilter.status !== "done" ? `
      ${overdue.length ? `<div class="section-head"><h3 style="color:var(--red)">ওভারডিউ (${overdue.length})</h3></div>${overdue.map(taskHTML).join("")}` : ""}
      ${todayL.length ? `<div class="section-head"><h3>আজ (${todayL.length})</h3></div>${todayL.map(taskHTML).join("")}` : ""}
      ${later.length ? `<div class="section-head"><h3>পরে (${later.length})</h3></div>${later.map(taskHTML).join("")}` : ""}
      ${!overdue.length && !todayL.length && !later.length && taskFilter.status==="open" ? '<div class="empty" style="padding:30px"><p>কোনো চলমান টাস্ক নেই</p></div>' : ""}
    ` : ""}
    ${(taskFilter.status === "done" || taskFilter.status === "all") && doneL.length ? `

function rTime(c) {

      </div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:4px" id="tmLabelShow">${esc(timer.label)||(timer.pomoMode?(timer.pomoPhase==="break"?"ব্রেক":"ফোকাস"):"ফোকাস সেশন")}</div>
      <div class="timer-display" id="timerDisp">${timer.pomoMode?fmtTime(pomoLeft):fmtTime(timer.secs)}</div>
      ${timer.pomoMode?`<div style="font-size:12px;color:var(--text3);margin-bottom:8px">${timer.pomoPhase==="break"?"☕ ব্রেক":"🎯 কাজ"} · টার্গেট ${Math.round(timer.pomoTarget/60)} মিনিট</div>`:""}
      <div class="timer-btns">
        <button class="btn btn-primary btn-lg" id="tmStartBtn" onclick="timerStart()">${timer.running?"⏸ পজ":"▶ স্টার্ট"}</button>
        <button class="btn btn-lg" onclick="timerReset()">রিসেট</button>
        <button class="btn btn-lg" onclick="timerSave()">লগ সেভ</button>
      </div>
      <div class="form-group" style="margin-top:16px;text-align:left">
        <label>সেশনের নাম</label>
        <input class="input" id="tmLabel" value="${esc(timer.label)}" placeholder="পড়ালেখা / প্রজেক্ট..." oninput="timer.label=this.value;const s=document.getElementById('tmLabelShow');if(s)s.textContent=this.value||'ফোকাস সেশন'">
      </div>
    </div>
    <div class="section-head"><h3>সাম্প্রতিক লগ</h3></div>
    ${logs.length ? logs.map(l => `
      <div class="item">

          <div class="item-title">${esc(l.label||"সেশন")}</div>
          <div class="item-meta">${l.date} · ${fmtTime(l.secs)}</div>
        </div>

      </div>
    `).join("") : '<div class="empty" style="padding:30px"><p>কোনো লগ নেই</p></div>'}
  `;
  tickTimer();
}
function setPomo(on) {
  clearInterval(timer.interval);
  timer.running = false;
  timer.pomoMode = !!on;
  timer.secs = 0;
  timer.pomoPhase = "work";
  timer.pomoTarget = 25 * 60;
  updateTimerPill();
  render();
}
function fmtTime(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return [h,m,sec].map(n => String(n).padStart(2,"0")).join(":");
}
function tickTimer() {
  const el = document.getElementById("timerDisp");
  if (el) {
    if (timer.pomoMode) el.textContent = fmtTime(Math.max(0, timer.pomoTarget - timer.secs));
    else el.textContent = fmtTime(timer.secs);
  }
  updateTimerPill();
  if (timer.pomoMode && timer.running && timer.secs >= timer.pomoTarget) {
    clearInterval(timer.interval);
    timer.running = false;
    if (timer.pomoPhase === "work") {
      toast("পমোডোরো শেষ! ৫ মিনিট ব্রেক", "ok");
      timer.pomoPhase = "break";
      timer.pomoTarget = 5 * 60;
      timer.secs = 0;
    } else {
      toast("ব্রেক শেষ! আবার ফোকাস", "ok");
      timer.pomoPhase = "work";
      timer.pomoTarget = 25 * 60;
      timer.secs = 0;
    }
    updateTimerPill();
    if (view === "time") render();
  }
}
function persistTimerState() {
  try {
    localStorage.setItem("omar_cc_timer_state", JSON.stringify({
      running: timer.running, secs: timer.secs, label: timer.label,
      pomoMode: timer.pomoMode, pomoPhase: timer.pomoPhase, pomoTarget: timer.pomoTarget,
      startedAt: timer.running ? Date.now() : null
    }));
  } catch(e) {}
}
function timerStart() {
  if (timer.running) {
    clearInterval(timer.interval); timer.running = false;
  } else {
    timer.running = true;
    timer._baseSecs = timer.secs;
    timer._startTs = Date.now();
    clearInterval(timer.interval);
    // Timestamp-based tick: immune to setInterval drift from tab throttling
    timer.interval = setInterval(() => {
      timer.secs = timer._baseSecs + Math.floor((Date.now() - timer._startTs) / 1000);
      tickTimer();
      persistTimerState();
    }, 1000);
  }
  updateTimerPill();
  persistTimerState();
  const btn = document.getElementById("tmStartBtn");
  if (btn) btn.textContent = timer.running ? "⏸ পজ" : "▶ স্টার্ট";
  if (!timer.running && view === "time") render();
  else tickTimer();
}
function timerReset() {
  clearInterval(timer.interval); timer.running = false; timer.secs = 0;
  if (timer.pomoMode) {
    timer.pomoPhase = "work";
    timer.pomoTarget = 25 * 60;
  }
  try { localStorage.removeItem("omar_cc_timer_state"); } catch(e) {}
  updateTimerPill();
  render();
}
function restoreTimerState() {
  try {
    const raw = localStorage.getItem("omar_cc_timer_state");
    if (!raw) return;
    const st = JSON.parse(raw);
    if (!st) return;
    timer.label = st.label || "";
    timer.pomoMode = !!st.pomoMode;
    timer.pomoPhase = st.pomoPhase || "work";
    timer.pomoTarget = st.pomoTarget || 25 * 60;
    timer.secs = st.secs || 0;
    if (st.running && st.startedAt) {
      // add elapsed time while the page/tab was closed
      timer.secs += Math.floor((Date.now() - st.startedAt) / 1000);
      timer.running = true;
      timer._baseSecs = timer.secs;
      timer._startTs = Date.now();
      timer.interval = setInterval(() => {
        timer.secs = timer._baseSecs + Math.floor((Date.now() - timer._startTs) / 1000);
        tickTimer();
        persistTimerState();
      }, 1000);
    }
    updateTimerPill();
  } catch(e) {}
}
function toggleSearch() {
  const w = document.getElementById("searchWrap");
  if (!w) return;
  w.classList.toggle("open");
  if (w.classList.contains("open")) {
    const inp = document.getElementById("globalSearch");
    if (inp) inp.focus();
  }

function timerSave() {
  if (timer.secs < 1) return toast("প্রথমে টাইমার চালান", "err");
  S.timeLogs.push({ id: uid(), label: timer.label || "সেশন", secs: timer.secs, date: today() });
  try { localStorage.removeItem("omar_cc_timer_state"); } catch(e) {}
  timerReset(); save();
  toast("টাইম লগ সেভ", "ok");
}

function rHabits(c, tr) {
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openHabit()">+ হ্যাবিট</button>`;
  if (!S.habits.length) {

    return;
  }
  const days = lastNDays(14);
  c.innerHTML = S.habits.map(h => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <strong>${esc(h.name)} <span class="badge b-green">${streakOf(h)} দিন স্ট্রিক</span></strong>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="openHabit('${h.id}')">এডিট</button>
          <button class="btn btn-sm btn-danger" onclick="delHabit('${h.id}')">✕</button>
        </div>
      </div>
      <div class="habit-scroll">
      <div class="habit-row" style="grid-template-columns:repeat(14,1fr)">
        ${days.map(d => {
          const on = (h.logs||[]).includes(d);
          const isT = d === today();
          return `<div class="habit-cell ${on?"on":""} ${isT?"today":""}" onclick="togHabit('${h.id}','${d}')" title="${d}">${d.slice(8)}</div>`;
        }).join("")}
      </div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">শেষ ১৪ দিন · মোট ${(h.logs||[]).length} চেক</div>
    </div>
  `).join("");
}
function lastNDays(n) {
  const a = [];
  for (let i=n-1;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); a.push(localDateStr(d)); }
  return a;
}
function streakOf(h) {
  const logs = (h.logs||[]).slice().sort().reverse();
  let s = 0; const t = new Date();
  for (let i=0;i<365;i++) {
    const d = new Date(t); d.setDate(d.getDate()-i);
    const k = localDateStr(d);
    if (logs.includes(k)) s++; else if (i>0) break;
  }
  return s;
}
function togHabit(id, day) {
  const h = S.habits.find(x=>x.id===id); if(!h) return;
  h.logs = h.logs || [];
  const i = h.logs.indexOf(day);
  if (i>=0) h.logs.splice(i,1); else h.logs.push(day);
  save(); render();
}
function openHabit(id) {
  const h = id ? S.habits.find(x=>x.id===id) : null;

}
function saveHabit(id) {
  const n = document.getElementById("hN").value.trim();
  if (!n) return toast("নাম দিন", "err");
  if (id) {
    const h = S.habits.find(x => x.id === id);

  } else {
    S.habits.push({ id: uid(), name: n, logs: [] });
  }
  save(); closeModal(); render();
  toast(id ? "হ্যাবিট আপডেট" : "হ্যাবিট যোগ", "ok");

function delHabit(id) {

    S.habits = S.habits.filter(h=>h.id!==id); save(); render(); toast("হ্যাবিট মুছে ফেলা হয়েছে", "info");

function rCal(c, tr) {
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openEvent()">+ ইভেন্ট</button>`;
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const weekStart = (S.settings.weekStart === 1) ? 1 : 0;
  const start = (first.getDay() - weekStart + 7) % 7;
  const dim = last.getDate();
  const locale = appLocale();
  const label = calCursor.toLocaleDateString(locale,{month:"long",year:"numeric"});
  const dows = weekStart === 1
    ? (locale === "en-US" ? ["Mo","Tu","We","Th","Fr","Sa","Su"] : ["সো","ম","বু","বৃ","শু","শ","র"])
    : (locale === "en-US" ? ["Su","Mo","Tu","We","Th","Fr","Sa"] : ["র","সো","ম","বু","বৃ","শু","শ"]);
  let html = `<div class="cal-head">
    <button class="btn btn-sm" onclick="calNav(-1)">‹</button>
    <h3 style="font-size:17px">${label}</h3>
    <button class="btn btn-sm" onclick="calNav(1)">›</button>
  </div>`;
  html += `<div class="cal-grid" style="margin-bottom:6px">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join("")}</div><div class="cal-grid">`;
  for (let i=0;i<start;i++) html += `<div class="cal-cell mute"></div>`;
  const tdKey = today();
  for (let d=1;d<=dim;d++) {
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const evs = S.events.filter(e => e.date === key);
    const isToday = key === tdKey;
    html += `<div class="cal-cell${isToday?" today":""}" style="cursor:pointer" onclick="openEvent(null,'${key}')" title="${isToday?"আজ":key}"><div class="cal-num">${d}</div>${isToday?'<div style="font-size:9px;font-weight:700;color:var(--accent);margin-bottom:2px">আজ</div>':""}${evs.map(e=>`<div class="cal-ev">${esc(e.title)}</div>`).join("")}</div>`;
  }
  html += `</div>`;
  const up = S.events.filter(e => e.date >= today()).sort((a,b)=>a.date.localeCompare(b.date));
  html += `<div class="section-head" style="margin-top:22px"><h3>আসন্ন ইভেন্ট</h3></div>`;
  html += up.map(e => `

function moneyNav(d) {
  const [y, m] = moneyMonth.split("-").map(Number);
  const dt = new Date(y, m - 1 + d, 1);
  moneyMonth = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;
  render();
}

  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openTx()">+ লেনদেন</button>`;

  const exp = S.txs.filter(t=>t.type==="out").reduce((s,t)=>s+(+t.amt||0),0);
  const cur = S.settings.currency;
  const ym = moneyMonth;
  const monthTx = S.txs.filter(t => (t.date||"").startsWith(ym));
  const mInc = monthTx.filter(t => t.type==="in").reduce((s,t)=>s+(+t.amt||0),0);
  const mExp = monthTx.filter(t => t.type==="out").reduce((s,t)=>s+(+t.amt||0),0);
  const catMap = {};

        <div class="money-bar out" style="height:${Math.max(4, Math.round(b.out/maxBar*100))}%;flex:1" title="ব্যয় ${b.out}"></div>
      </div>

      <div class="stat-card"><div class="stat-label">মোট ব্যয়</div><div class="stat-num" style="color:var(--red);font-size:22px">${cur}${fmtMoney(exp)}</div></div>

      </div>
      <div class="grid g2">

          <div>আয়: <b style="color:var(--green)">${cur}${fmtMoney(mInc)}</b></div>
          <div>ব্যয়: <b style="color:var(--red)">${cur}${fmtMoney(mExp)}</b></div>
          <div>নেট: <b>${cur}${fmtMoney(mInc-mExp)}</b></div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:4px">শেষ ৬ মাস</div>
          <div style="display:flex;gap:12px;font-size:11px;color:var(--text3);margin-bottom:6px">
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent-soft);vertical-align:middle"></span> আয়</span>
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--red-soft);vertical-align:middle"></span> ব্যয়</span>
          </div>

      </div>
      <div class="card">
        <div class="section-head"><h3>এই মাসের লেনদেন</h3></div>
        ${monthTx.slice().reverse().map(t => `
          <div class="item" style="padding:8px 10px">
            <div class="item-body"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${t.date||""}</div></div>
            <span style="font-weight:700;color:${t.type==="in"?"var(--green)":"var(--red)"}">${t.type==="in"?"+":"-"}${cur}${fmtMoney(t.amt)}</span>
          </div>
        `).join("") || '<div style="font-size:13px;color:var(--text3);padding:8px">কিছু নেই</div>'}
      </div>
    </div>
    <div class="section-head"><h3>সব লেনদেন</h3></div>
    ${S.txs.slice().reverse().map(t => `
      <div class="item">
        <div class="item-body">
          <div class="item-title">${esc(t.title)}</div>
          <div class="item-meta">${t.date||""} · ${esc(t.cat||"")}</div>

        <span style="font-weight:700;color:${t.type==="in"?"var(--green)":"var(--red)"}">${t.type==="in"?"+":"-"}${cur}${fmtMoney(t.amt)}</span>

}

function rFiles(c, tr) {
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openFile()">+ ফাইল</button>`;
  if (!S.files.length) {
    c.innerHTML = `<div class="empty"><div class="big">📎</div><p>কোনো ফাইল নেই</p><button class="btn btn-primary btn-lg" onclick="openFile()">ফাইল যোগ করুন</button></div>`;
    return;
  }
  c.innerHTML = `<div class="grid g2">${S.files.map(f => {
    const isPdf = f.type==="file" && f.url && (/\.pdf($|\?)/i.test(f.url) || /pdf/i.test(f.name||""));
    let media = "";
    if (f.type==="image" && f.url) media = `<img src="${f.url}" class="media-img" style="max-height:140px;object-fit:cover;width:100%;border-radius:10px">`;
    else if (f.type==="video" && f.url) media = `<video src="${f.url}" controls style="width:100%;max-height:160px;border-radius:10px"></video>`;
    else if (f.type==="audio" && f.url) media = `<audio src="${f.url}" controls style="width:100%;margin-top:8px"></audio>`;
    else if (isPdf && f.url) media = `<iframe src="${f.url}" style="width:100%;height:160px;border:1px solid var(--border);border-radius:10px;margin-top:6px"></iframe>`;
    return `
    <div class="card card-hover">
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">${f.type==="image"?"🖼️":f.type==="video"?"🎬":f.type==="audio"?"🎵":isPdf?"📕":"📄"} ${esc(f.name)}</div>
      ${media}
      <div style="font-size:12px;color:var(--text3);margin-top:8px">${f.added||""}</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        ${f.url?`<a class="btn btn-sm" href="${f.url}" target="_blank" rel="noopener">খুলুন</a>`:""}
        <button class="btn btn-sm btn-danger" onclick="delFile('${f.id}')">মুছুন</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}
function openFile() {
  showModal(`
    <h3>ফাইল / মিডিয়া যোগ</h3>
    <div class="form-group"><label>নাম</label><input class="input" id="fN"></div>
    <div class="form-group"><label>ধরন</label>
      <select class="select" id="fTy">
        <option value="file">ফাইল / PDF / লিংক</option>
        <option value="image">ইমেজ</option>
        <option value="video">ভিডিও</option>
        <option value="audio">অডিও</option>
      </select>
    </div>
    <div class="form-group"><label>URL (YouTube / লিংক)</label><input class="input" id="fU" placeholder="https://..."></div>
    <div class="form-group"><label>অথবা ফাইল আপলোড</label><input type="file" class="input" id="fF" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"></div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px">Google লগইন থাকলে Firebase Storage-এ যাবে। নইলে ছোট ফাইল লোকাল base64।</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">বাতিল</button>
      <button class="btn btn-primary" onclick="saveFile()">সেভ</button>
    </div>
  `);
}
async function saveFile() {
  const name = document.getElementById("fN").value.trim() || "আননেমড";
  let type = document.getElementById("fTy").value;
  let url = document.getElementById("fU").value.trim();
  const fi = document.getElementById("fF");
  if (fi.files[0]) {
    const f = fi.files[0];
    if (f.type.startsWith("image/")) type = "image";
    else if (f.type.startsWith("video/")) type = "video";
    else if (f.type.startsWith("audio/")) type = "audio";
    else type = "file";
    document.getElementById("saveDot").textContent = "আপলোড হচ্ছে...";
    let cloudUrl = await uploadToCloud(f, "media");
    if (cloudUrl) {
      url = cloudUrl;
    } else {
      if (f.size > 1.8e6) return toast("ক্লাউড ছাড়া ১.৮MB এর বেশি ফাইল রাখা যায় না। Google লগইন করুন।", "err");
      try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
    }
  }
  if (!url) return toast("URL দিন অথবা ফাইল সিলেক্ট করুন", "err");
  S.files.push({ id: uid(), name, type, url, added: today() });
  save(); closeModal(); render();
}
function delFile(id) {
  appConfirm("এই ফাইল মুছে ফেলবেন?", () => {
    S.files = S.files.filter(f=>f.id!==id); save(); render(); toast("ফাইল মুছে ফেলা হয়েছে", "info");
  });
}

function openPort(id) {

    <div class="form-group"><label>টাইটেল</label><input class="input" id="poT" value="${esc(p?.title||"")}"></div>
    <div class="form-group"><label>ট্যাগ / ক্যাটাগরি</label><input class="input" id="poG" value="${esc(p?.tag||"")}" placeholder="ওয়েব, রিসার্চ, ডিজাইন..."></div>
    <div class="form-group"><label>বিবরণ</label><textarea class="textarea" id="poD">${esc(p?.desc||"")}</textarea></div>

async function savePort(id) {
  const title = document.getElementById("poT").value.trim();
  if (!title) return toast("টাইটেল দিন", "err");
  let cover = document.getElementById("poC").value.trim();
  const fi = document.getElementById("poF");
  if (fi && fi.files[0]) {
    const f = fi.files[0];
    let url = await uploadToCloud(f, "portfolio");
    if (!url) {
      try { url = await readAsDataURL(f, 1.5e6); } catch { return toast("ছবি বড় — Google লগইন করুন", "err"); }
    }
    cover = url;
  }
  const d = { title, tag: document.getElementById("poG").value, desc: document.getElementById("poD").value, link: document.getElementById("poL").value, cover };
  if (id) Object.assign(S.portfolio.find(x=>x.id===id), d);
  else S.portfolio.push({ id: uid(), ...d });
  save(); closeModal(); render();
  toast(id ? "আপডেট" : "যোগ হয়েছে", "ok");
}
function delPort(id) {
  appConfirm("এই পোর্টফোলিও আইটেম মুছে ফেলবেন?", () => {
    S.portfolio = S.portfolio.filter(p=>p.id!==id); save(); render(); toast("মুছে ফেলা হয়েছে", "info");
  });
}

  `;

  };
  tick();
  clockInterval = setInterval(tick, 1000);
}

/* ============================================================
   CALCULATOR (Basic + Scientific)
   ============================================================ */
let calcExpr = "";
/** Safe arithmetic only — no Function/eval */
function safeCalc(expr) {
  if (!expr || !/^[0-9+\-*/().\s]+$/.test(expr)) return null;
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    if (/\s/.test(expr[i])) { i++; continue; }
    if ("+-*/()".includes(expr[i])) { tokens.push(expr[i]); i++; continue; }
    if (/[0-9.]/.test(expr[i])) {
      let n = "";
      while (i < expr.length && /[0-9.]/.test(expr[i])) n += expr[i++];
      tokens.push(parseFloat(n));
      continue;
    }
    return null;
  }
  let p = 0;
  function peek() { return tokens[p]; }
  function next() { return tokens[p++]; }
  function parseExpr() {
    let v = parseTerm();
    while (peek() === "+" || peek() === "-") {
      const op = next();
      const r = parseTerm();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  }
  function parseTerm() {
    let v = parseFactor();
    while (peek() === "*" || peek() === "/") {
      const op = next();
      const r = parseFactor();
      v = op === "*" ? v * r : v / r;
    }
    return v;
  }
  function parseFactor() {
    if (peek() === "-") { next(); return -parseFactor(); }
    if (peek() === "+") { next(); return parseFactor(); }
    if (peek() === "(") {
      next();
      const v = parseExpr();
      if (next() !== ")") throw new Error(")");
      return v;
    }
    const n = next();
    if (typeof n !== "number" || isNaN(n)) throw new Error("n");
    return n;
  }
  const result = parseExpr();
  if (p !== tokens.length) throw new Error("t");
  return result;
}

        <button class="calc-btn" onclick="calcFn('0')">0</button>
        <button class="calc-btn" onclick="calcFn('.')">.</button>
        <button class="calc-btn fn" onclick="calcFn('±')">±</button>

        <button class="calc-btn fn" onclick="calcFn('sqrt')">√</button>
        <button class="calc-btn fn" onclick="calcFn('sq')">x²</button>
        <button class="calc-btn fn" onclick="calcFn('inv')">1/x</button>
        <button class="calc-btn fn" onclick="calcFn('log')">log</button>
        <button class="calc-btn fn" onclick="calcFn('sin')">sin</button>
        <button class="calc-btn fn" onclick="calcFn('cos')">cos</button>
        <button class="calc-btn fn" onclick="calcFn('tan')">tan</button>
        <button class="calc-btn fn" onclick="calcFn('pi')">π</button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:10px;text-align:center">sin/cos/tan ডিগ্রিতে · log = log₁₀ · ⌫ মুছে ফেলে</div>
    </div>
  `;
  calcExpr = "";
}
function calcFn(k) {
  const d = document.getElementById("calcD");
  if (!d) return;
  if (k === "C") { calcExpr = ""; d.value = "0"; return; }
  if (k === "CE") { calcExpr = ""; d.value = "0"; return; }
  if (k === "⌫") {
    calcExpr = (calcExpr || "").slice(0, -1);
    d.value = calcExpr || "0";
    return;
  }
  if (k === "pi") {
    if (d.value === "0" || d.value === "Error") calcExpr = "";
    calcExpr += String(Math.PI);
    d.value = calcExpr;
    return;
  }
  if (k === "=") {
    try {
      let e = calcExpr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
      const r = safeCalc(e);
      if (r === null || !isFinite(r)) throw new Error("bad");
      // round floating noise
      const rounded = Math.round(r * 1e12) / 1e12;
      d.value = rounded; calcExpr = String(rounded);
    } catch { d.value = "Error"; calcExpr = ""; }
    return;
  }
  if (k === "±") {
    if (calcExpr) { calcExpr = calcExpr.startsWith("-") ? calcExpr.slice(1) : "-" + calcExpr; d.value = calcExpr; }
    return;
  }
  const unary = {
    sqrt: x => Math.sqrt(x),
    sq: x => Math.pow(x, 2),
    inv: x => 1 / x,
    "%": x => x / 100,
    sin: x => Math.sin(x * Math.PI / 180),
    cos: x => Math.cos(x * Math.PI / 180),
    tan: x => Math.tan(x * Math.PI / 180),
    log: x => Math.log10(x)
  };
  if (unary[k]) {
    try {
      const r = unary[k](parseFloat(calcExpr || d.value));
      if (!isFinite(r)) throw new Error("bad");
      const rounded = Math.round(r * 1e12) / 1e12;
      d.value = rounded; calcExpr = String(rounded);
    } catch { d.value = "Error"; calcExpr = ""; }
    return;
  }
  if (d.value === "0" || d.value === "Error") calcExpr = "";
  calcExpr += k;
  d.value = calcExpr;
}

async function saveProfile() {
  let avatar = (document.getElementById("pA") || {}).value || "";
  avatar = avatar.trim();
  let cover = (document.getElementById("pCover") || {}).value || "";
  cover = cover.trim();
  const photoEl = document.getElementById("pPhoto");
  if (photoEl && photoEl.files[0]) {
    const f = photoEl.files[0];
    document.getElementById("saveDot").textContent = "ছবি আপলোড...";
    let url = await uploadToCloud(f, "avatar");
    if (!url) {
      try { url = await readAsDataURL(f, 1.5e6); } catch { toast("ছবি খুব বড় (১.৫MB এর কম) অথবা Google লগইন করুন", "err"); return; }
    }
    avatar = url;
  }
  const coverEl = document.getElementById("pCoverFile");
  if (coverEl && coverEl.files[0]) {
    const f = coverEl.files[0];
    document.getElementById("saveDot").textContent = "কভার আপলোড...";
    let url = await uploadToCloud(f, "cover");
    if (!url) {
      try { url = await readAsDataURL(f, 1.8e6); } catch { toast("কভার ছবি বড় — Google লগইন করুন", "err"); return; }
    }
    cover = url;
  }
  const g = id => (document.getElementById(id) || {}).value || "";
  S.profile = {
    name: g("pN"),
    title: g("pTitle"),
    company: g("pCompany"),
    bio: g("pB"),
    location: g("pLoc"),
    college: g("pC"),
    subject: g("pS"),
    birthday: g("pBday"),
    blood: g("pBlood"),
    address: g("pAddr"),
    email: g("pE"),
    phone: g("pP"),
    whatsapp: g("pWa"),
    website: g("pWeb"),
    linkedin: g("pLi"),
    github: g("pGh"),
    facebook: g("pFb"),
    skills: g("pSkills"),
    goals: g("pG"),
    avatar,
    cover
  };
  updateUser(); save();
  toast("প্রোফাইল সেভ হয়েছে", "ok");
  render();
}

function saveFirebaseConfig() {
  const raw = document.getElementById("fbCfgPaste").value.trim();
  try {
    let obj = JSON.parse(raw);
    // allow paste of full firebase snippet object
    if (!obj.apiKey && obj.firebase) obj = obj.firebase;
    if (!obj.apiKey) return toast("সঠিক config JSON দিন (apiKey লাগবে)", "err");
    localStorage.setItem(FB_CFG_KEY, JSON.stringify(obj));
    toast("কনফিগ সেভ — রিলোড হচ্ছে...", "ok");
    setTimeout(() => location.reload(), 600);
  } catch (e) {
    toast("JSON পার্স ব্যর্থ — কনফিগ চেক করুন", "err");
  }
}
function clearFirebaseConfig() {
  appConfirm("Firebase কনফিগ মুছবেন?", () => {
    localStorage.removeItem(FB_CFG_KEY);
    toast("কনফিগ মুছে ফেলা হয়েছে — রিলোড...", "info");
    setTimeout(() => location.reload(), 500);
  });
}
function copyText(id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => toast("কপি হয়েছে", "ok")).catch(() => toast("কপি ব্যর্থ", "err"));
}

  } catch (e) {
    toast("সিঙ্ক ব্যর্থ", "err");
  }
  render();
}
function chgPw() {
  const oldEl = document.getElementById("oldPw");
  const n = (document.getElementById("nwPw") || {}).value || "";
  const n2 = (document.getElementById("nwPw2") || {}).value || "";
  if (oldEl && oldEl.value !== S.pw) return toast("বর্তমান পাসওয়ার্ড ভুল", "err");
  if (n.length < 6) return toast("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর", "err");
  if (document.getElementById("nwPw2") && n !== n2) return toast("নতুন পাসওয়ার্ড মিলছে না", "err");
  S.pw = n; save(); toast("পাসওয়ার্ড পরিবর্তন হয়েছে", "ok");
  if (oldEl) oldEl.value = "";
  const a = document.getElementById("nwPw"); if (a) a.value = "";
  const b = document.getElementById("nwPw2"); if (b) b.value = "";
}
function setTheme(t) {
  applyTheme(t);
  save();
  render();
  toast(t === "dark" ? "ডার্ক থিম" : "লাইট থিম", "ok");
}
function applyDensity() {
  const content = document.getElementById("content");
  if (!content) return;
  if (S.settings.density === "compact") content.style.padding = "14px 14px 90px";
  else content.style.padding = "";
}
function saveSet() {
  const cur = document.getElementById("sCur");
  const week = document.getElementById("sWeek");
  const disp = document.getElementById("sDisp");
  const df = document.getElementById("sDateFmt");
  const fab = document.getElementById("sFab");
  if (cur) S.settings.currency = cur.value || "৳";
  if (week) S.settings.weekStart = +week.value;
  if (disp && disp.value.trim()) S.profile.name = disp.value.trim();
  if (df) S.settings.dateFormat = df.value;
  if (fab) S.settings.fabShow = fab.value === "1";
  updateUser(); save();
  const fabEl = document.getElementById("fab");
  if (fabEl) fabEl.classList.toggle("show", S.settings.fabShow !== false && fabViews.includes(view));
  toast("সেটিংস সেভ হয়েছে", "ok");
  // settings page-এ থেকেই preview আপডেট (sync line ইত্যাদি)
  if (view === "settings") render();
}
function exportData() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
  a.download = "omar-command-center-backup-" + today() + ".json";
  a.click();
  toast("ব্যাকআপ ডাউনলোড শুরু", "ok");
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      appConfirm("বর্তমান ডেটা রিপ্লেস হবে। নিশ্চিত?", () => {
        Object.assign(S, data);
        ensureFolders(); save(); updateUser(); render(); toast("ইমপোর্ট সফল", "ok");
      });
    } catch { toast("ভুল JSON ফাইল", "err"); }
  };
  r.readAsText(f);
}
function resetAll() {
  appConfirm("সব লোকাল ডেটা মুছে যাবে। নিশ্চিত?", () => {
    appConfirm("আবার নিশ্চিত করুন — এটি আনডু করা যাবে না।", () => {
      doResetAll();
    });
  });
}
function doResetAll() {
  localStorage.removeItem(KEY);
  location.reload();
}
</script>
</body>
</html>
