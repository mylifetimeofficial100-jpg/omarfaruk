/* ========== DESIGN SYSTEM 2026 — Calm Professional ========== */
:root, [data-theme="light"] {
  --bg: #f4f6fa;
  --bg2: #ffffff;
  --sidebar: #ffffff;
  --card: #ffffff;
  --card2: #f0f2f8;
  --border: #e5e9f2;
  --border2: #d0d6e4;
  --text: #0f172a;
  --text2: #475569;
  --text3: #94a3b8;
  --accent: #4f46e5;
  --accent2: #818cf8;
  --accent-soft: rgba(79,70,229,.10);
  --green: #059669;
  --green-soft: rgba(5,150,105,.12);
  --red: #dc2626;
  --red-soft: rgba(220,38,38,.10);
  --orange: #d97706;
  --orange-soft: rgba(217,119,6,.12);
  --radius: 16px;
  --radius-sm: 11px;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.04);
  --shadow-lg: 0 8px 30px rgba(15,23,42,.08), 0 2px 8px rgba(15,23,42,.04);
  --input-bg: #f8fafc;
  --gate-bg: #eef2ff;
  --overlay: rgba(15,23,42,.45);
  --grad: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
  --grad-soft: linear-gradient(135deg, rgba(79,70,229,.07), rgba(129,140,248,.05));
  --ring: 0 0 0 3px rgba(79,70,229,.18);
}
[data-theme="dark"] {
  --bg: #0b1120;
  --bg2: #111827;
  --sidebar: #0f1629;
  --card: #151d2e;
  --card2: #1c2640;
  --border: #243049;
  --border2: #334155;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --accent: #818cf8;
  --accent2: #a5b4fc;
  --accent-soft: rgba(129,140,248,.16);
  --green: #34d399;
  --green-soft: rgba(52,211,153,.14);
  --red: #f87171;
  --red-soft: rgba(248,113,113,.14);
  --orange: #fbbf24;
  --orange-soft: rgba(251,191,36,.14);
  --shadow: 0 4px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  --input-bg: rgba(0,0,0,.25);
  --gate-bg: #0b1120;
  --overlay: rgba(0,0,0,.65);
  --grad: linear-gradient(135deg, #6366f1 0%, #818cf8 50%, #a5b4fc 100%);
  --grad-soft: linear-gradient(135deg, rgba(99,102,241,.12), rgba(165,180,252,.06));
  --ring: 0 0 0 3px rgba(129,140,248,.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::-webkit-scrollbar-track { background: transparent; }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #334155; }

/* ========== GATE ========== */
#gate {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: var(--gate-bg);
  overflow: hidden;
}
#gate::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 65% 50% at 18% -8%, rgba(79,70,229,.20) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 100% 105%, rgba(129,140,248,.14) 0%, transparent 55%),
    radial-gradient(ellipse 40% 35% at 100% 0%, rgba(99,102,241,.10) 0%, transparent 50%);
}
#gate::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--text) 7%, transparent) 1px, transparent 1px);
  background-size: 26px 26px;
  -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 0%, transparent 72%);
          mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 0%, transparent 72%);
}
.gate-card {
  position: relative; z-index: 1;

}
@keyframes gateIn {

}
.gate-logo {

}
.gate-logo::after {

}
.gate-logo img {

}
.gate-eyebrow {

}
.gate-eyebrow::before, .gate-eyebrow::after {

}
.gate-eyebrow::after { background: linear-gradient(90deg, var(--accent2), transparent); }
.gate-card h1 {

}
.gate-card .sub {

  letter-spacing: .2px;
}
.gate-card input {
  width: 100%; padding: 14px 46px 14px 16px; border-radius: 13px;
  border: 1.5px solid var(--border); background: var(--input-bg);

  transition: border .15s, box-shadow .15s, background .15s;
}
.gate-card input::placeholder { color: var(--text3); font-weight: 500; }
.gate-card input:focus {
  border-color: var(--accent);
  box-shadow: var(--ring);
  background: var(--bg2);
}
.gate-pw-wrap { position: relative; margin-bottom: 14px; }
.gate-pw-eye {
  position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border: none; background: none;
  cursor: pointer; font-size: 15px; color: var(--text3); border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  transition: color .15s, background .15s;
}
.gate-pw-eye:hover { color: var(--text); background: var(--card2); }
.gate-card .btn-main {
  width: 100%; padding: 14px; border: none; border-radius: 13px;
  background: var(--grad); color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; box-shadow: 0 8px 22px rgba(79,70,229,.32);
  transition: transform .15s, box-shadow .15s, filter .15s;
  letter-spacing: .2px;
}
.gate-card .btn-main:active { transform: translateY(0) scale(.98); }
.gate-card .btn-main:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(79,70,229,.4); filter: brightness(1.04); }
.gate-card .btn-google {
  width: 100%; padding: 13px; border-radius: 13px; cursor: pointer;
  background: var(--bg2); border: 1.5px solid var(--border);
  color: var(--text); font-size: 14px; font-weight: 600;

  transition: background .15s, border-color .15s, transform .15s;

}
.gate-card .btn-google:hover { background: var(--card2); border-color: var(--border2); transform: translateY(-1px); }
.gate-card .btn-google:active { transform: translateY(0); }
.gate-or {
  display: flex; align-items: center; gap: 14px;
  margin: 0 0 18px; color: var(--text3); font-size: 11.5px;

}
.gate-or::before, .gate-or::after {

}
#gateErr { color: var(--red); font-size: 13px; min-height: 0; margin-top: 12px; font-weight: 600; }
#gateErr:empty { margin-top: 0; }
.gate-help-link {
  display: inline-block; margin-top: 16px; background: none; border: none;

}
.gate-help-link:hover { color: var(--accent); background: var(--card2); }

/* ========== APP SHELL ========== */
#app { display: none; height: 100vh; }
.shell { display: flex; height: 100%; }

/* Sidebar */
#sidebar {
  width: 268px; flex-shrink: 0;
  background: var(--sidebar);

}
.sb-top {

}
.sb-logo {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 17px; color: #fff; flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(79,70,229,.32), inset 0 1px 0 rgba(255,255,255,.25);

.sb-logo svg { width: 100%; height: 100%; display: block; }
.sb-title { font-size: 14px; font-weight: 800; letter-spacing: -.3px; color: var(--text); line-height: 1.25; }
.sb-sub { font-size: 10.5px; color: var(--accent); margin-top: 2px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

.sb-nav { flex: 1; overflow-y: auto; padding: 2px 10px 14px; }
.nav-label {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1px;
  padding: 14px 12px 6px;
}
.nav-btn {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 10px;
  cursor: pointer; color: var(--text2); font-size: 13.5px; font-weight: 500;
  transition: background .14s, color .14s; margin-bottom: 1px;
  border: none; background: none; width: 100%; text-align: left;
  position: relative;
}
.nav-btn:hover { background: var(--card2); color: var(--text); }
.nav-btn.active {
  background: var(--accent-soft); color: var(--accent); font-weight: 700;
}
.nav-btn.active::before {
  content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 16px; border-radius: 0 3px 3px 0; background: var(--grad);
}
.nav-btn .ico { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; opacity: .95; }

.sb-bottom {
  padding: 10px 12px 14px; border-top: 1px solid var(--border);
}
.user-pill {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 12px; cursor: pointer;
  transition: background .15s;
}
.user-pill:hover { background: var(--card2); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff; overflow: hidden; flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(79,70,229,.25);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-meta { flex: 1; min-width: 0; }
.user-meta .nm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.user-meta .rl { font-size: 11px; color: var(--text3); font-weight: 500; }

#overlay {
  display: none; position: fixed; inset: 0;
  background: var(--overlay); z-index: 90;
}

/* Main area */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: transparent; position: relative; z-index: 1; }
#topbar {
  height: 58px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg2) 90%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  position: relative;
}
#burger {
  display: none; background: none; border: none;
  color: var(--text); font-size: 22px; cursor: pointer; padding: 6px;
}
#pageTitle { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -.3px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topRight { display: flex; align-items: center; gap: 8px; }
#saveDot {
  font-size: 11.5px; color: var(--text3); margin-right: 4px; font-weight: 500;
}
#searchWrap { display: flex; align-items: center; gap: 6px; max-width: 240px; flex: 1; margin: 0 4px; }
#searchWrap .input { width: 100%; border-radius: 999px; padding-left: 14px; }
#searchToggle { display: none; background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px; color: var(--text); }
@media (max-width: 720px) {
  #searchWrap { display: none; position: absolute; left: 48px; right: 12px; top: 54px; max-width: none; z-index: 70;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px; box-shadow: var(--shadow-lg); }
  #searchWrap.open { display: flex; }
  #searchToggle { display: inline-flex; }
  #netBadge { display: none; }
  #saveDot { display: none; }
}

#content {
  flex: 1; overflow-y: auto;
  padding: 22px 24px 100px;
  position: relative;
  z-index: 1;
  background: transparent;
}
/* Cards stay solid so text stays readable over watermark */
#content .card,
#content .stat-card,
#content .item,
#content .tbl-wrap,
#content .empty {
  position: relative;
  z-index: 1;
}

/* ========== Center circular watermark — professional ========== */
#nameWatermark {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
#nameWatermark .wm-orb {
  position: relative;
  width: min(72vw, 520px);
  height: min(72vw, 520px);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* soft glow core */
#nameWatermark .wm-glow {
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(99, 102, 241, 0.14) 0%,
    rgba(168, 85, 247, 0.08) 40%,
    rgba(236, 72, 153, 0.04) 65%,
    transparent 75%);
  filter: blur(8px);
  animation: wmPulse 10s ease-in-out infinite;
}
[data-theme="dark"] #nameWatermark .wm-glow {
  background: radial-gradient(circle,
    rgba(129, 140, 248, 0.18) 0%,
    rgba(167, 139, 250, 0.1) 40%,
    rgba(244, 114, 182, 0.05) 65%,
    transparent 75%);
}
/* concentric rings */
#nameWatermark .wm-ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid transparent;
  box-sizing: border-box;
}
#nameWatermark .wm-ring.r1 {
  inset: 8%;
  border-color: rgba(79, 70, 229, 0.12);
  background: linear-gradient(135deg, rgba(99,102,241,0.04), rgba(236,72,153,0.03));
}
#nameWatermark .wm-ring.r2 {
  inset: 0;
  border-color: rgba(124, 58, 237, 0.1);
  border-style: dashed;
  border-width: 1.5px;
  animation: wmSpin 80s linear infinite;
}
#nameWatermark .wm-ring.r3 {
  inset: 22%;
  border-color: rgba(236, 72, 153, 0.1);
}
#nameWatermark .wm-ring.r4 {
  inset: 34%;
  border-color: rgba(79, 70, 229, 0.08);
  border-style: dotted;
  animation: wmSpinRev 100s linear infinite;
}
[data-theme="dark"] #nameWatermark .wm-ring.r1 { border-color: rgba(129, 140, 248, 0.18); }
[data-theme="dark"] #nameWatermark .wm-ring.r2 { border-color: rgba(167, 139, 250, 0.15); }
[data-theme="dark"] #nameWatermark .wm-ring.r3 { border-color: rgba(244, 114, 182, 0.14); }
[data-theme="dark"] #nameWatermark .wm-ring.r4 { border-color: rgba(129, 140, 248, 0.12); }
/* center name */
#nameWatermark .wm-name {
  position: relative;
  z-index: 2;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-weight: 800;
  font-size: clamp(22px, 4.2vw, 36px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.25;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 40%, #db2777 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  opacity: 0.22;
}
[data-theme="dark"] #nameWatermark .wm-name {
  opacity: 0.28;
  background: linear-gradient(135deg, #818cf8 0%, #c084fc 45%, #f472b6 100%);
  -webkit-background-clip: text;
  background-clip: text;
}
#nameWatermark .wm-name span {
  display: block;
  font-size: 0.55em;
  font-weight: 600;
  letter-spacing: 0.28em;
  margin-top: 6px;
  opacity: 0.85;
}
@keyframes wmPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.04); opacity: 0.85; }
}
@keyframes wmSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes wmSpinRev {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

/* ========== SHARED UI ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .14s, border-color .14s, transform .12s, box-shadow .14s;
  white-space: nowrap; color: var(--text);
}
.btn:hover { background: var(--card2); border-color: var(--border2); }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--grad);
  border: none; color: #fff; font-weight: 700;
  box-shadow: 0 4px 14px rgba(79,70,229,.3), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(79,70,229,.38); }
.btn-danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 28%, transparent); background: var(--red-soft); }
.btn-danger:hover { background: color-mix(in srgb, var(--red) 16%, transparent); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 9px; font-weight: 600; }
.btn-lg { padding: 13px 24px; font-size: 14.5px; border-radius: 13px; }
.btn-icon {
  width: 38px; height: 38px; padding: 0; border-radius: 11px;
  font-size: 17px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 19px 19px;
  box-shadow: var(--shadow);
  transition: border-color .15s, box-shadow .2s, transform .15s;
}
.card-hover:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius); padding: 19px 17px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  transition: transform .18s, box-shadow .2s, border-color .18s;
}
.stat-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad); opacity: .95;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border2); }
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
.stat-num { font-size: 27px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
.stat-sub { font-size: 12px; color: var(--text2); margin-top: 3px; font-weight: 500; }

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-head h3 { font-size: 13px; font-weight: 700; color: var(--text2); letter-spacing: -.1px; }

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text3); margin-bottom: 6px;
}
.input, .select, .textarea {
  width: 100%; padding: 11px 13px; border-radius: 11px;
  border: 1.5px solid var(--border); background: var(--input-bg);
  font-size: 14px; outline: none; transition: border .15s, box-shadow .15s; color: var(--text);
  font-weight: 500;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: var(--ring);
  background: var(--bg2);
}
.textarea { min-height: 88px; resize: vertical; }

.badge {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 99px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
}
.b-blue { background: var(--accent-soft); color: var(--accent); }
.b-green { background: var(--green-soft); color: var(--green); }
.b-red { background: var(--red-soft); color: var(--red); }
.b-orange { background: var(--orange-soft); color: var(--orange); }

.empty {
  text-align: center; padding: 52px 20px; color: var(--text3);
}
.empty .big { font-size: 48px; margin-bottom: 12px; opacity: .55; }
.empty p { font-size: 14px; margin-bottom: 18px; font-weight: 500; line-height: 1.55; }

/* List items */
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 13px;
  background: var(--card); border: 1px solid var(--border);
  margin-bottom: 7px; transition: background .14s, border-color .14s, transform .14s;
  box-shadow: var(--shadow);
}
.item:hover { background: var(--card2); border-color: var(--border2); transform: translateX(1px); }
.item.done .item-title { text-decoration: line-through; color: var(--text3); }
.item-check { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 14px; font-weight: 600; color: var(--text); }
.item-meta { font-size: 12px; color: var(--text3); margin-top: 2px; font-weight: 500; }

/* Modal */
.modal-back {
  position: fixed; inset: 0; background: var(--overlay);
  z-index: 500; display: none; align-items: center; justify-content: center;
  padding: 16px; backdrop-filter: blur(8px);
}
.modal-back.show { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px; width: 100%; max-width: 460px;
  max-height: 88vh; overflow-y: auto; padding: 28px;
  box-shadow: var(--shadow-lg);
  color: var(--text);
  animation: gateIn .3s cubic-bezier(.16,1,.3,1);
}
.modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 18px; letter-spacing: -.3px; color: var(--text); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* FAB */
#fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 54px; height: 54px; border-radius: 16px;
  background: var(--grad);
  color: #fff; border: none; font-size: 28px; font-weight: 400;
  cursor: pointer; box-shadow: 0 8px 28px rgba(79,70,229,.35);
  z-index: 40; display: none; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
}
#fab.show { display: flex; }
#fab:hover { transform: scale(1.06) translateY(-1px); box-shadow: 0 12px 32px rgba(79,70,229,.42); }

#toastWrap {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  width: min(400px, 92vw);
}
.toast {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow-lg);
  font-size: 13.5px; animation: toastIn .25s ease;
  display: flex; align-items: center; gap: 10px;
}
.toast.ok { border-left: 3px solid var(--green); }
.toast.err { border-left: 3px solid var(--red); }
.toast.info { border-left: 3px solid var(--accent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.folder-row {
  display: flex; align-items: center; gap: 6px; padding: 8px 10px 4px;
  font-size: 11.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .4px;
}
#searchPanel {
  display: none; position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
  width: min(420px, 94vw); max-height: min(60vh, 420px); overflow-y: auto;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg); z-index: 80; padding: 8px;
}
#searchPanel.show { display: block; }
#timerPill {
  display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  white-space: nowrap; cursor: pointer;
}
#timerPill.show { display: inline-flex; }
#netBadge {
  font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px;
  white-space: nowrap;
}
#netBadge.online { background: var(--green-soft); color: var(--green); }
#netBadge.offline { background: var(--orange-soft); color: var(--orange); }
.habit-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.habit-scroll .habit-row { min-width: 420px; }
.block-wrap.dragging { opacity: .45; }
.block-wrap.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
.money-bar-wrap { display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-top: 12px; }
.money-bar {
  flex: 1; background: var(--accent-soft); border-radius: 6px 6px 0 0;
  min-height: 4px; position: relative; transition: height .2s;
}
.money-bar.out { background: var(--red-soft); }
.port-cover {
  width: 100%; height: 120px; object-fit: cover; border-radius: 12px;
  margin-bottom: 10px; background: var(--card2);
}
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.search-hit {
  padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13.5px;
}
.search-hit:hover { background: var(--card2); }
.search-hit .meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
#onboardBanner {
  background: linear-gradient(135deg, rgba(59,125,255,.12), rgba(108,92,231,.1));
  border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px;
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
}
#uploadBar {
  display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1000;
  background: transparent;
}
#uploadBar .fill {
  height: 100%; width: 0%; background: var(--grad);
  transition: width .2s;
}

/* ========== DASHBOARD ========== */
.greet { margin-bottom: 24px; }
.greet h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; color: var(--text); }
.greet p { color: var(--text2); font-size: 14px; margin-top: 4px; font-weight: 500; }

/* Home Notepad + Todo */
.home-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
@media (max-width: 860px) { .home-duo { grid-template-columns: 1fr; } }
.home-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 380px; overflow: hidden;
}
.home-panel-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--border); background: var(--bg2);
}
.home-panel-head .ph-ico {
  width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.home-panel-head .ph-title { font-size: 14.5px; font-weight: 700; color: var(--text); }
.home-panel-head .ph-sub { font-size: 11.5px; color: var(--text3); margin-top: 1px; }
.home-panel-head .ph-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.np-body { flex: 1; display: flex; flex-direction: column; padding: 0; min-height: 0; }
.np-ta {
  flex: 1; width: 100%; min-height: 260px; border: none; outline: none; resize: none;
  padding: 16px 18px; font-size: 15px; line-height: 1.7; color: var(--text);
  background: transparent; font-family: inherit;
}
.np-ta::placeholder { color: var(--text3); }
.np-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg2);
  font-size: 11.5px; color: var(--text3);
}
.np-foot .np-save-ok { color: var(--green); font-weight: 600; }
.todo-quick {
  display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.todo-quick input {
  flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--input-bg); font-size: 13.5px; outline: none; color: var(--text);
}
.todo-quick input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--bg2); }
.todo-list-home { flex: 1; overflow-y: auto; padding: 8px 10px 14px; max-height: 320px; }
.todo-item-h {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 10px;
  border-radius: 11px; margin-bottom: 4px; transition: background .12s;
  border: 1px solid transparent;
}
.todo-item-h:hover { background: var(--bg2); border-color: var(--border); }
.todo-item-h.done .todo-t { text-decoration: line-through; color: var(--text3); }
.todo-item-h input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.todo-item-h .todo-t { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.4; }
.todo-item-h .todo-m { font-size: 11.5px; color: var(--text3); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.todo-item-h .todo-acts { margin-left: auto; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; flex-shrink: 0; }
.todo-item-h:hover .todo-acts { opacity: 1; }
.todo-filters { display: flex; gap: 4px; }
.todo-filters button {
  border: none; background: transparent; font-size: 11.5px; font-weight: 600;
  padding: 5px 10px; border-radius: 8px; cursor: pointer; color: var(--text3);
}
.todo-filters button.on { background: var(--accent-soft); color: var(--accent); }
.pri-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pri-dot.high { background: var(--red); }
.pri-dot.med { background: var(--orange); }
.pri-dot.low { background: var(--green); }

/* ========== WORKSPACE / PAGES ========== */
.ws-layout {
  display: flex; gap: 0; height: calc(100vh - 130px); min-height: 420px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
}
.ws-tree {
  width: 260px; flex-shrink: 0; overflow-y: auto;
  background: var(--bg2); border-right: 1px solid var(--border);
  padding: 12px 10px 20px; display: flex; flex-direction: column;
}
.ws-tree-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 8px 12px; gap: 8px;
}
.ws-tree-head h4 { font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; margin: 0; }
.ws-search {
  width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); font-size: 13px; outline: none; margin-bottom: 10px; color: var(--text);
}
.ws-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ws-tree-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-radius: 10px; cursor: pointer;
  font-size: 13.5px; color: var(--text2); margin-bottom: 2px;
  transition: background .12s, color .12s; border: none; background: none; width: 100%; text-align: left;
}
.ws-tree-item:hover { background: var(--card); color: var(--text); }
.ws-tree-item.active {
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.ws-tree-item .pg-ico { flex-shrink: 0; font-size: 14px; opacity: .85; }
.ws-tree-item .pg-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-folder-head {
  display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px;
  font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .4px;
}
.ws-folder-head .fd-acts { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.ws-folder-head:hover .fd-acts { opacity: 1; }
.ws-folder-head button {
  background: none; border: none; cursor: pointer; color: var(--text3); font-size: 12px; padding: 2px 5px; border-radius: 6px;
}
.ws-folder-head button:hover { background: var(--card); color: var(--text); }
.ws-editor {
  flex: 1; overflow-y: auto; min-width: 0; padding: 28px 32px 80px;
  background: var(--card);
}
.ws-editor-top {
  display: flex; align-items: flex-start; gap: 12px; margin-bottom: 6px; flex-wrap: wrap;
}
.ws-title-input {
  flex: 1; min-width: 180px; font-size: 28px; font-weight: 700;
  background: transparent; border: none; outline: none;
  color: var(--text); padding: 0 0 8px; letter-spacing: -.4px; line-height: 1.25;
}
.ws-title-input::placeholder { color: var(--text3); }
.ws-meta-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.ws-meta-row .select { width: auto; min-width: 130px; padding: 7px 10px; font-size: 12.5px; border-radius: 9px; }
.ws-meta-hint { font-size: 12px; color: var(--text3); margin-left: auto; }
.block {
  position: relative;
  background: transparent; border: 1px solid transparent;
  border-radius: 12px; padding: 12px 14px 12px 36px; margin-bottom: 4px;
  transition: background .12s, border-color .12s;
}
.block:hover, .block:focus-within {
  background: var(--bg2); border-color: var(--border);
}
.block.dragging { opacity: .4; }
.block.drag-over { outline: 2px dashed var(--accent); outline-offset: 1px; }
.block-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px; opacity: 0; transition: opacity .15s;
  position: absolute; left: 4px; top: 10px; right: 8px; pointer-events: none;
}
.block:hover .block-bar, .block:focus-within .block-bar { opacity: 1; pointer-events: auto; }
.block-label {
  font-size: 11px; color: var(--text3); letter-spacing: .3px; font-weight: 600;
  cursor: grab; user-select: none; padding: 2px 4px;
}
.block-acts { display: flex; gap: 2px; margin-left: auto; }
.block-x {
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 13px; padding: 3px 7px; border-radius: 6px; line-height: 1;
}
.block-x:hover { background: var(--card); color: var(--text); }
.block-x.danger:hover { color: var(--red); background: var(--red-soft); }
.block-ta {
  width: 100%; min-height: 56px; background: transparent;
  border: none; border-radius: 0; color: var(--text);
  padding: 4px 0; font-size: 15px; line-height: 1.6;
  resize: vertical; outline: none;
}
.block-ta:focus { box-shadow: none; background: transparent; }
.todo-line {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid var(--border);
}
.todo-line:last-child { border-bottom: none; }
.todo-line input[type=text] {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 14.5px;
}
.todo-line.done input[type=text] { text-decoration: line-through; color: var(--text3); }
.add-line { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; margin-top: 8px; padding: 4px 0; font-weight: 500; }
.block-tools {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px;
  padding: 14px; background: var(--bg2); border: 1px dashed var(--border);
  border-radius: 14px;
}
.block-tools .btn { border-radius: 10px; font-size: 12.5px; padding: 8px 12px; background: var(--card); }
.block-tools .tools-label {
  width: 100%; font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px;
}
.ws-empty-blocks {
  text-align: center; padding: 48px 20px; color: var(--text3);
  border: 1px dashed var(--border); border-radius: 14px; margin-bottom: 12px;
}
.ws-empty-blocks p { margin-bottom: 6px; font-size: 14px; }

/* Table */
.tbl-wrap { overflow-x: auto; }
table.mini { border-collapse: collapse; width: 100%; min-width: 320px; }
table.mini th, table.mini td { border: 1px solid var(--border); padding: 6px 8px; }
table.mini th { background: var(--card2); font-size: 12px; color: var(--text3); }
table.mini input { width: 100%; background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; }

/* Media */
.media-img { max-width: 100%; border-radius: 10px; margin-top: 8px; }
.media-vid { width: 100%; max-width: 520px; aspect-ratio: 16/9; border-radius: 10px; background: #000; margin-top: 8px; }
.file-link {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 13px; background: var(--card2); border: 1px solid var(--border);
  border-radius: 9px; font-size: 13px; margin-top: 8px; text-decoration: none; color: var(--accent);
}

/* Habits */
.habit-row {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px;
}
.habit-cell {
  aspect-ratio: 1; border-radius: 8px; background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; cursor: pointer; transition: .15s; color: var(--text3);
}
.habit-cell.on { background: var(--green); color: #fff; font-weight: 700; }
.habit-cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Routine Timeline */
.routine-timeline { display: flex; flex-direction: column; gap: 0; padding: 4px 0 8px; }
.routine-step {
  display: grid; grid-template-columns: 64px 28px 1fr; gap: 12px;
  align-items: stretch; position: relative; padding: 6px 0;
}
.routine-step.done .rt-title.strike { text-decoration: line-through; color: var(--text3); }
.routine-step.current .rt-body {
  background: var(--accent-soft); border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-soft);
}
.rt-time { text-align: right; padding-top: 10px; }
.rt-clock { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.rt-dur { font-size: 11px; color: var(--text3); margin-top: 2px; }
.rt-line { display: flex; flex-direction: column; align-items: center; position: relative; }
.rt-dot {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--card2); border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text3); z-index: 1;
  flex-shrink: 0; transition: all .2s;
}
.rt-dot.on {
  background: var(--green); border-color: var(--green); color: #fff;
}
.routine-step.current .rt-dot {
  background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.rt-connector {
  flex: 1; width: 2px; background: var(--border); min-height: 18px; margin: 4px 0;
}
.rt-body {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 4px;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.rt-body:hover { border-color: var(--border2); }
.rt-title-row { display: flex; align-items: flex-start; gap: 8px; }
.rt-check-wrap {
  display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; cursor: pointer;
}
.rt-check-wrap input[type=checkbox] {
  width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
}
.rt-title { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.4; }
.rt-acts { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; flex-shrink: 0; }
.routine-step:hover .rt-acts { opacity: 1; }
.rt-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.rt-note {
  margin-top: 8px; font-size: 12.5px; color: var(--text2); line-height: 1.5;
  padding: 8px 10px; background: var(--bg2); border-radius: 8px;
}
@media (max-width: 600px) {
  .routine-step { grid-template-columns: 52px 22px 1fr; gap: 8px; }
  .rt-clock { font-size: 12px; }
  .rt-acts { opacity: 1; }
}

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--text3); padding: 4px; font-weight: 600; }
.cal-cell {
  min-height: 68px; background: var(--card); border: 1px solid var(--border);
  border-radius: 9px; padding: 5px 6px; font-size: 12px;
  transition: border-color .15s, background .15s;
}
.cal-cell.mute { opacity: .3; }
.cal-cell.today {
  border: 2px solid var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent-soft);
}
.cal-cell.today .cal-num {
  color: var(--accent);
  font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 11px;
  margin-bottom: 4px;
}
.cal-num { font-weight: 600; margin-bottom: 3px; }
.cal-ev {
  font-size: 10px; padding: 2px 4px; border-radius: 4px;
  background: var(--accent-soft); color: var(--accent);
  margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Tools: Clock & Calculator */
.clock-big {
  font-size: 58px; font-weight: 700; letter-spacing: -1.5px;
  text-align: center; font-variant-numeric: tabular-nums;
  background: var(--grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.clock-date { text-align: center; color: var(--text2); font-size: 15.5px; margin-top: 8px; }

.calc-box {
  max-width: 340px; margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 20px; box-shadow: var(--shadow-lg);
}
.calc-display {
  width: 100%; padding: 18px; border-radius: 13px;
  background: var(--input-bg); border: 1px solid var(--border);
  font-size: 30px; font-weight: 600; text-align: right;
  margin-bottom: 14px; font-variant-numeric: tabular-nums;
  outline: none; color: var(--text);
}
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-btn {
  padding: 16px 0; border-radius: 13px; border: 1px solid var(--border);
  background: var(--card2); font-size: 18px; font-weight: 600;
  cursor: pointer; transition: .12s; color: var(--text);
}
.calc-btn:hover { background: var(--border); opacity: .95; }
.calc-btn.op { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.calc-btn.eq { background: var(--grad); color: #fff; border: none; }
.calc-btn.fn { font-size: 13px; color: var(--text2); }

/* Time Tracker */
.timer-display {
  font-size: 48px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums; letter-spacing: -1px;
  margin: 16px 0;
}
.timer-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Portfolio */
.port-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; transition: .15s;
}
.port-card:hover { border-color: var(--border2); transform: translateY(-2px); }

/* Profile */
.prof-hero {
  display: flex; align-items: flex-end; gap: 18px; margin-bottom: 8px;
  position: relative; z-index: 1;
}
.prof-cover {
  height: 140px; border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 55%, #a78bfa 100%);
  margin: -20px -20px 0; position: relative; overflow: hidden;
}
.prof-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prof-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 700; color: #fff; overflow: hidden; flex-shrink: 0;
  border: 4px solid var(--card); box-shadow: var(--shadow);
  margin-top: -48px;
}
.prof-avatar img { width: 100%; height: 100%; object-fit: cover; }
.prof-stat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0;
}
.prof-stat {
  text-align: center; padding: 12px 8px; background: var(--card2);
  border-radius: 12px; border: 1px solid var(--border);
}
.prof-stat .n { font-size: 18px; font-weight: 700; color: var(--text); }
.prof-stat .l { font-size: 11px; color: var(--text3); margin-top: 2px; }
.prof-section {
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
}
.prof-section h4 {
  font-size: 13px; font-weight: 600; color: var(--text2);
  margin-bottom: 12px; letter-spacing: .2px;
}
.prof-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 500;
  background: var(--accent-soft); color: var(--accent); margin: 0 6px 6px 0;
}
.prof-link-row {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
}
.prof-link-row a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 10px; font-size: 12.5px;
  background: var(--card2); border: 1px solid var(--border);
  color: var(--text); text-decoration: none; transition: .15s;
}

/** Upload file to Firebase Storage (Google cloud). Returns download URL or null */
async function uploadToCloud(file, folder) {
  if (!useCloud || !storage || !currentUser) return null;
  try {
    const path = `users/${currentUser.uid}/${folder || "files"}/${Date.now()}_${file.name}`;
    const ref = storage.ref().child(path);
    showUpload(10);
    const task = ref.put(file);
    task.on("state_changed", snap => {
      if (snap.totalBytes) showUpload(Math.round(snap.bytesTransferred / snap.totalBytes * 100));
    });
    await task;
    showUpload(100);
    return await ref.getDownloadURL();
  } catch (e) {
    console.warn("Storage upload failed", e);
    showUpload(100);
    return null;
  }
}

/** Read small file as base64 (local fallback) */
function readAsDataURL(file, maxBytes) {
  return new Promise((resolve, reject) => {
    if (maxBytes && file.size > maxBytes) return reject(new Error("ফাইল বড়"));
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/** Compress / resize image for localStorage (avatar/cover) */
function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 512;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    if (!file || !file.type || !file.type.startsWith("image/")) {
      return reject(new Error("শুধু ছবি ফাইল"));
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (!w || !h) { URL.revokeObjectURL(url); return reject(new Error("ছবি পড়া যায়নি")); }
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        let data = canvas.toDataURL("image/jpeg", quality);
        // if still huge, lower quality
        if (data.length > 450000) data = canvas.toDataURL("image/jpeg", 0.65);
        if (data.length > 700000) data = canvas.toDataURL("image/jpeg", 0.5);
        resolve(data);
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("ছবি লোড ব্যর্থ")); };
    img.src = url;
  });
}

function loadLocal() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) Object.assign(S, JSON.parse(r));
  } catch(e) {}
  normalizeState();
}

async function pushCloud() {
  if (!useCloud || !db || !currentUser) return false;
  try {
    const { pw, ...cloudData } = S;
    cloudData._updatedAt = S._updatedAt || Date.now();
    cloudData._syncedAt = Date.now();
    cloudData._uid = currentUser.uid;
    cloudData._email = currentUser.email || "";
    // Firestore ~1MB limit — strip huge base64 if needed
    const raw = JSON.stringify(cloudData);
    if (raw.length > 900000) {
      console.warn("Cloud payload large", raw.length);
      toast("ডেটা বড় — কিছু ছবি/ফাইল ক্লাউডে নাও যেতে পারে", "info");
    }
    await db.collection("users").doc(currentUser.uid).set(cloudData);
    lastSyncAt = new Date();
    lastSyncError = null;
    try { localStorage.setItem("omar_cc_last_sync", String(Date.now())); } catch(e) {}
    return true;
  } catch (e) {
    console.warn("Cloud push failed", e);
    lastSyncError = e.message || "সিঙ্ক ব্যর্থ";
    return false;
  }
}

async function loadCloud(opts) {
  opts = opts || {};
  if (!useCloud || !db || !currentUser) return;
  try {
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      const data = doc.data() || {};
      const { pw, ...rest } = data;
      const cloudTime = rest._updatedAt || 0;
      const localRaw = localStorage.getItem(KEY);
      let localTime = 0;
      try { if (localRaw) localTime = JSON.parse(localRaw)._updatedAt || 0; } catch(e) {}

      // স্মার্ট মার্জ: নতুনটার জয়
      if (!localTime || cloudTime >= localTime || opts.forceCloud) {
        Object.assign(S, rest);
        normalizeState();
        localStorage.setItem(KEY, JSON.stringify(S));
        lastSyncAt = new Date();
        lastSyncError = null;
        if (!opts.silent) toast("☁️ ক্লাউড থেকে ডেটা লোড হয়েছে", "ok");
      } else {
        // লোকাল নতুন → ক্লাউডে আপলোড
        lastSyncAt = new Date();
        lastSyncError = null;
        const ok = await pushCloud();
        if (!opts.silent) toast(ok ? "☁️ লোকাল ডেটা ক্লাউডে আপলোড হয়েছে" : "লোকাল নতুন — ক্লাউড আপলোড ব্যর্থ", ok ? "ok" : "err");
      }
    } else {
      if (!opts.silent) toast("নতুন ক্লাউড অ্যাকাউন্ট — লোকাল ডেটা আপলোড হচ্ছে", "info");
      S._updatedAt = Date.now();
      await pushCloud();
    }
  } catch (e) {
    console.warn("Cloud load failed", e);
    lastSyncError = e.message || "লোড ব্যর্থ";
    if (!opts.silent) toast("ক্লাউড লোড ব্যর্থ — লোকাল ডেটা চলছে", "err");
  }
}

async function loginWithGoogle() {
  document.getElementById("gateErr").textContent = "";
  if (!useCloud || !auth) {
    document.getElementById("gateErr").textContent = "Firebase কনফিগ সেট করা হয়নি। লোকাল পাসওয়ার্ড দিয়ে ঢুকে সেটিংস → ক্লাউড থেকে সেটআপ করুন।";
    return;
  }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const result = await auth.signInWithPopup(provider);
    currentUser = result.user;
    if (currentUser.displayName && (!S.profile.name || S.profile.name === "আমার নাম" || S.profile.name === "Omar Faruk")) {
      S.profile.name = currentUser.displayName;
    }
    if (currentUser.email) S.profile.email = currentUser.email;
    if (currentUser.photoURL && (!S.profile.avatar || S.profile.avatar === "profile.jpg")) {
      S.profile.avatar = currentUser.photoURL;
    }
    sessionStorage.setItem("cc_ok", "google");
    await loadCloud();
    startAutoSync();
    enter();
    toast("Google অ্যাকাউন্টে সংযুক্ত — ডেটা অটো সিঙ্ক হবে", "ok");
  } catch (e) {
    console.error(e);
    let msg = e.message || "error";
    if (String(msg).includes("unauthorized-domain")) {
      msg = "এই ডোমেইন Firebase-এ অনুমোদিত নয়। Firebase Console → Authentication → Settings → Authorized domains-এ আপনার Netlify ডোমেইন যোগ করুন।";
    }
    document.getElementById("gateErr").textContent = "Google লগইন ব্যর্থ: " + msg;
  }
}

    const modal = document.getElementById("modalBack");

    const panel = document.getElementById("searchPanel");
    if (panel) panel.classList.remove("show");

    if (wrap) wrap.classList.remove("open");

  }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    e.preventDefault();
    const wrap = document.getElementById("searchWrap");
    if (wrap) wrap.classList.add("open");

  const parts = Math.abs(n).toFixed(2).split(".");
  let intPart = parts[0];
  // South-Asian (lakh/crore) style grouping: last 3 digits, then groups of 2
  let out = intPart.slice(-3);
  let rest = intPart.slice(0, -3);
  while (rest.length > 0) {
    out = rest.slice(-2) + "," + out;
    rest = rest.slice(0, -2);
  }
  const dec = parts[1] === "00" ? "" : "." + parts[1];
  return (neg ? "-" : "") + out + dec;
}

function homeTodoListHTML() {
  const f = window._todoFilter || "open";
  let list = S.tasks.slice();
  if (f === "open") list = list.filter(t => !t.done);
  else if (f === "done") list = list.filter(t => t.done);
  list.sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    const rank = { high: 0, med: 1, low: 2, "": 3 };
    return (rank[a.pri || ""] ?? 3) - (rank[b.pri || ""] ?? 3);
  });
  list = list.slice(0, 12);
  if (!list.length) {
    return `<div class="empty" style="padding:36px 16px"><p style="font-size:14px">${f === "done" ? "সম্পন্ন কাজ নেই" : "কোনো কাজ নেই — উপরে যোগ করুন"}</p></div>`;
  }
  const td = today();
  return list.map(t => {
    const overdue = !t.done && t.due && t.due < td;
    const isToday = t.due === td;
    return `
      <div class="todo-item-h ${t.done ? "done" : ""}">
        <input type="checkbox" ${t.done ? "checked" : ""} onchange="togTask('${t.id}')">
        <div style="flex:1;min-width:0">
          <div class="todo-t">${esc(t.title)}</div>
          <div class="todo-m">
            ${t.pri ? `<span><span class="pri-dot ${t.pri}"></span> ${t.pri}</span>` : ""}
            ${t.due ? `<span style="color:${overdue ? "var(--red)" : isToday ? "var(--accent)" : "var(--text3)"}">📅 ${t.due}${overdue ? " · ওভারডিউ" : isToday ? " · আজ" : ""}</span>` : ""}
            ${t.project || t.projectId ? `<span>📁 ${esc(t.project || projectName(t.projectId) || "")}</span>` : ""}
          </div>
        </div>
        <div class="todo-acts">
          <button class="btn btn-sm" onclick="openTask('${t.id}')" title="এডিট">✎</button>
          <button class="btn btn-sm btn-danger" onclick="delTask('${t.id}')" title="মুছুন">✕</button>
        </div>
      </div>`;
  }).join("");
}
function quickAddTodo() {
  const inp = document.getElementById("homeTodoInput");
  if (!inp) return;
  const title = inp.value.trim();
  if (!title) return toast("কাজের নাম লিখুন", "err");
  S.tasks.push({
    id: uid(), title, pri: "", due: today(), projectId: "", project: "", note: "", done: false, created: Date.now()
  });
  inp.value = "";
  save();
  toast("টাস্ক যোগ হয়েছে", "ok");

  else go("dash");
}
function clearNotepad() {

function todayTasks() {
  const td = today();
  const list = S.tasks.filter(t => !t.done && (!t.due || t.due === td || t.due < td)).slice(0,5);
  if (!list.length) return '<div class="empty" style="padding:28px"><p>আজকের কোনো টাস্ক নেই 🎉</p></div>';
  return list.map(t => `
    <div class="item ${t.done?"done":""}" style="margin-bottom:6px;padding:10px 12px">
      <input type="checkbox" class="item-check" ${t.done?"checked":""} onchange="togTask('${t.id}')">
      <div class="item-body"><div class="item-title">${esc(t.title)}</div></div>
      ${t.pri?`<span class="badge b-${t.pri==="high"?"red":t.pri==="med"?"orange":"green"}">${t.pri}</span>`:""}
    </div>
  `).join("");
}
function dashEvents() {
  const up = S.events.filter(e => e.date >= today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if (!up.length) return '<div class="empty" style="padding:20px"><p>কোনো আসন্ন ইভেন্ট নেই</p></div>';

        <div class="item-title">${esc(e.title)}</div>

}
function dashHabits() {

    <div class="form-group"><label>নাম</label><input class="input" id="fdN" value="${esc(f.name)}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">বাতিল</button>
      <button class="btn btn-primary" onclick="saveFolderRename('${id}')">সেভ</button>
    </div>
  `);
}
function saveFolderRename(id) {
  const name = document.getElementById("fdN").value.trim();
  if (!name) return toast("নাম দিন", "err");
  const f = S.folders.find(x => x.id === id);
  if (f) f.name = name;
  save(); closeModal(); render();
  toast("ফোল্ডার আপডেট", "ok");
}
function delFolder(id) {
  if (S.folders.length <= 1) return toast("কমপক্ষে একটা ফোল্ডার থাকতে হবে", "err");
  appConfirm("ফোল্ডার মুছবেন? পেজগুলো 'সাধারণ' এ চলে যাবে।", () => {
    const fallback = S.folders.find(f => f.id !== id)?.id || "f_default";
    S.pages.forEach(p => { if (p.folderId === id) p.folderId = fallback; });
    S.folders = S.folders.filter(f => f.id !== id);
    if (workFolderFilter === id) workFolderFilter = "all";
    save(); render();
    toast("ফোল্ডার মুছে ফেলা হয়েছে", "info");
  });
}

function drawBlocks(blocks) {
  const el = document.getElementById("blocks");
  if (!el) return;
  el.innerHTML = "";
  blocks.forEach((b, i) => el.appendChild(makeBlock(b, i)));
}

function makeBlock(b, i) {
  const w = document.createElement("div");
  w.className = "block";
  const labels = { text:"টেক্সট", heading:"হেডিং", todo:"টু-ডু", table:"টেবিল", image:"ইমেজ", video:"ভিডিও", audio:"অডিও", file:"ফাইল", link:"লিংক", callout:"নোট", code:"কোড", divider:"ডিভাইডার" };
  // Drop target on whole block; drag only from handle
  w.ondragover = e => { e.preventDefault(); w.classList.add("drag-over"); };
  w.ondragleave = () => w.classList.remove("drag-over");
  w.ondrop = e => {
    e.preventDefault();
    w.classList.remove("drag-over");
    if (dragBlockIdx === null || dragBlockIdx === i) return;
    const p = S.pages.find(x => x.id === S.currentPage);
    if (!p || !p.blocks) return;
    const [moved] = p.blocks.splice(dragBlockIdx, 1);
    p.blocks.splice(i, 0, moved);
    dragBlockIdx = null;
    drawBlocks(p.blocks); save();
  };

  const bar = document.createElement("div");
  bar.className = "block-bar";
  const handle = document.createElement("span");
  handle.className = "block-label";
  handle.style.cssText = "cursor:grab;user-select:none";
  handle.draggable = true;
  handle.textContent = "⠿ " + (labels[b.type] || b.type);
  handle.title = "টেনে সরান";
  handle.ondragstart = e => {
    dragBlockIdx = i;
    w.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(i));
  };
  handle.ondragend = () => {
    dragBlockIdx = null;
    w.classList.remove("dragging");
    document.querySelectorAll(".block.drag-over, .block-wrap.drag-over").forEach(el => el.classList.remove("drag-over"));
  };
  bar.appendChild(handle);
  const acts = document.createElement("div");
  acts.className = "block-acts";
  const up = document.createElement("button");
  up.className = "block-x"; up.textContent = "↑"; up.title = "উপরে";
  up.onclick = () => moveBlock(i, -1);
  const dn = document.createElement("button");
  dn.className = "block-x"; dn.textContent = "↓"; dn.title = "নিচে";
  dn.onclick = () => moveBlock(i, 1);
  const x = document.createElement("button");
  x.className = "block-x danger"; x.textContent = "✕"; x.title = "মুছুন";
  x.onclick = () => {
    const p = S.pages.find(x => x.id === S.currentPage);
    p.blocks.splice(i,1); drawBlocks(p.blocks); save();
  };
  acts.append(up, dn, x);
  bar.appendChild(acts);
  w.appendChild(bar);

  if (b.type === "text" || b.type === "callout" || b.type === "code") {
    const ta = document.createElement("textarea");
    ta.className = "block-ta";
    if (b.type === "callout") {
      ta.style.borderLeft = "3px solid var(--accent)";
      ta.style.paddingLeft = "12px";
      ta.style.background = "var(--accent-soft)";
      ta.style.borderRadius = "0 8px 8px 0";
      ta.style.padding = "10px 12px";
    }
    if (b.type === "code") {
      ta.style.fontFamily = "ui-monospace, SFMono-Regular, Menlo, monospace";
      ta.style.fontSize = "13px";
      ta.style.background = "var(--bg2)";
      ta.style.borderRadius = "8px";
      ta.style.padding = "12px";
      ta.style.border = "1px solid var(--border)";
    }
    ta.value = b.content || "";
    ta.placeholder = b.type === "code" ? "// কোড লিখুন..." : (b.type === "callout" ? "গুরুত্বপূর্ণ নোট..." : "লিখতে শুরু করুন...");
    ta.oninput = () => { b.content = ta.value; save(); };
    // auto-grow
    ta.style.overflow = "hidden";
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(56, ta.scrollHeight) + "px"; };
    ta.addEventListener("input", grow);
    setTimeout(grow, 0);
    w.appendChild(ta);
  }
  if (b.type === "heading") {
    const inp = document.createElement("input");
    inp.className = "input";
    inp.style.cssText = "font-size:22px;font-weight:700;border:none;background:transparent;padding:4px 0;box-shadow:none";
    inp.value = b.content || "";
    inp.placeholder = "হেডিং...";
    inp.oninput = () => { b.content = inp.value; save(); };
    w.appendChild(inp);
  }
  if (b.type === "todo") {
    const list = document.createElement("div");
    (b.items || []).forEach((it, j) => {
      const row = document.createElement("div");
      row.className = "todo-line" + (it.done ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!it.done;
      cb.onchange = () => { it.done = cb.checked; row.classList.toggle("done", it.done); save(); };
      const tx = document.createElement("input");
      tx.type = "text"; tx.value = it.text || ""; tx.placeholder = "কাজ...";
      tx.oninput = () => { it.text = tx.value; save(); };
      const rm = document.createElement("button");
      rm.textContent = "✕"; rm.style.cssText = "background:none;border:none;color:var(--text3);cursor:pointer";
      rm.onclick = () => { b.items.splice(j,1); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); save(); };
      row.append(cb, tx, rm);
      list.appendChild(row);
    });
    w.appendChild(list);
    const add = document.createElement("button");
    add.className = "add-line"; add.textContent = "+ নতুন কাজ";
    add.onclick = () => {
      b.items = b.items || [];
      b.items.push({ text:"", done:false });
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); save();
    };
    w.appendChild(add);
  }
  if (b.type === "table") {
    b.rows = b.rows || [["কলাম ১","কলাম ২"],["",""]];
    const tw = document.createElement("div"); tw.className = "tbl-wrap";
    const tb = document.createElement("table"); tb.className = "mini";
    b.rows.forEach((row, ri) => {
      const tr = document.createElement("tr");
      row.forEach((cell, ci) => {
        const td = document.createElement(ri===0?"th":"td");
        const inp = document.createElement("input");
        inp.value = cell;
        inp.oninput = () => { b.rows[ri][ci] = inp.value; save(); };
        td.appendChild(inp); tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tw.appendChild(tb); w.appendChild(tw);
    const acts = document.createElement("div");
    acts.style.cssText = "display:flex;gap:8px;margin-top:8px";
    acts.innerHTML = `
      <button class="btn btn-sm" onclick="(function(){const p=S.pages.find(x=>x.id===S.currentPage);const bl=p.blocks[${i}];bl.rows.push(new Array(bl.rows[0].length).fill(''));drawBlocks(p.blocks);save()})()">+ সারি</button>
      <button class="btn btn-sm" onclick="(function(){const p=S.pages.find(x=>x.id===S.currentPage);const bl=p.blocks[${i}];bl.rows.forEach((r,ri)=>r.push(ri===0?'নতুন':''));drawBlocks(p.blocks);save()})()">+ কলাম</button>
    `;
    w.appendChild(acts);
  }
  if (b.type === "image") {
    const inp = document.createElement("input");
    inp.className = "input"; inp.placeholder = "ইমেজ URL...";
    inp.value = b.url || "";
    inp.oninput = () => { b.url = inp.value; save(); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); };
    w.appendChild(inp);
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "image/*"; fi.style.marginTop = "8px";
    fi.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("saveDot").textContent = "আপলোড...";
      let url = await uploadToCloud(f, "workspace");
      if (!url) {
        if (f.size > 1.8e6) return toast("১.৮MB এর ছোট ইমেজ দিন অথবা Google লগইন করুন", "err");
        try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
      }
      b.url = url; save();
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks);
      toast("ইমেজ যোগ হয়েছে", "ok");
    };
    w.appendChild(fi);
    if (b.url) {
      const img = document.createElement("img");
      img.src = b.url; img.className = "media-img";
      img.onerror = () => img.style.display = "none";
      w.appendChild(img);
    }
  }
  if (b.type === "video") {
    const inp = document.createElement("input");
    inp.className = "input"; inp.placeholder = "YouTube / ভিডিও URL...";
    inp.value = b.url || "";
    inp.oninput = () => { b.url = inp.value; save(); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); };
    w.appendChild(inp);
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "video/*"; fi.style.marginTop = "8px";
    fi.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("saveDot").textContent = "আপলোড...";
      let url = await uploadToCloud(f, "workspace");
      if (!url) {
        if (f.size > 1.8e6) return toast("ক্লাউড ছাড়া বড় ভিডিও রাখা যায় না — Google লগইন করুন", "err");
        try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
      }
      b.url = url; save();
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks);
      toast("ভিডিও যোগ হয়েছে", "ok");
    };
    w.appendChild(fi);
    if (b.url) {
      let src = b.url;
      const yt = b.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
      if (yt) {
        src = `https://www.youtube.com/embed/${yt[1]}`;
        const ifr = document.createElement("iframe");
        ifr.src = src; ifr.className = "media-vid";
        ifr.allow = "accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture";
        ifr.allowFullscreen = true;
        w.appendChild(ifr);
      } else {
        const vid = document.createElement("video");
        vid.src = b.url; vid.controls = true; vid.className = "media-vid";
        w.appendChild(vid);
      }
    }
  }
  if (b.type === "audio") {
    const inp = document.createElement("input");
    inp.className = "input"; inp.placeholder = "অডিও URL...";
    inp.value = b.url || "";
    inp.oninput = () => { b.url = inp.value; save(); drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks); };
    w.appendChild(inp);
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "audio/*"; fi.style.marginTop = "8px";
    fi.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("saveDot").textContent = "আপলোড...";
      let url = await uploadToCloud(f, "workspace");
      if (!url) {
        if (f.size > 1.8e6) return toast("ক্লাউড ছাড়া বড় অডিও রাখা যায় না — Google লগইন করুন", "err");
        try { url = await readAsDataURL(f); } catch { return toast("ফাইল পড়া যায়নি", "err"); }
      }
      b.url = url; save();
      drawBlocks(S.pages.find(x=>x.id===S.currentPage).blocks);
      toast("অডিও যোগ হয়েছে", "ok");
    };
    w.appendChild(fi);
    if (b.url) {
      const au = document.createElement("audio");
      au.controls = true; au.src = b.url; au.style.width = "100%"; au.style.marginTop = "8px";
      w.appendChild(au);
    }
  }
  if (b.type === "file" || b.type === "link") {
    const n = document.createElement("input");
    n.className = "input"; n.placeholder = b.type==="link" ? "লিংকের নাম" : "ফাইলের নাম (PDF ইত্যাদি)";
    n.value = b.name || ""; n.oninput = () => { b.name = n.value; save(); };
    w.appendChild(n);
    const u = document.createElement("input");
    u.className = "input"; u.style.marginTop = "6px";
    u.placeholder = "URL..."; u.value = b.url || "";
    u.oninput = () => { b.url = u.value; save(); };
    w.appendChild(u);
    if (b.url) {
      const a = document.createElement("a");
      a.href = b.url; a.target = "_blank"; a.className = "file-link";
      a.textContent = (b.type==="link"?"🔗 ":"📥 ") + (b.name || "খুলুন");
      w.appendChild(a);
    }
  }
  if (b.type === "divider") {
    const hr = document.createElement("hr");
    hr.style.cssText = "border:none;border-top:1px solid var(--border);margin:6px 0";
    w.appendChild(hr);
  }
  return w;
}

function addBlock(type) {
  const p = S.pages.find(x => x.id === S.currentPage);
  if (!p) return;
  p.blocks = p.blocks || [];
  const b = { type };
  if (["text","heading","callout","code"].includes(type)) b.content = "";
  if (type === "todo") b.items = [];
  if (type === "table") b.rows = [["কলাম ১","কলাম ২"],["",""]];
  if (["image","video","audio","file","link"].includes(type)) b.url = "";
  if (["file","link"].includes(type)) b.name = "";
  p.blocks.push(b);
  drawBlocks(p.blocks); save();
}
function moveBlock(idx, dir) {
  const p = S.pages.find(x => x.id === S.currentPage);
  if (!p || !p.blocks) return;
  const j = idx + dir;
  if (j < 0 || j >= p.blocks.length) return;
  const tmp = p.blocks[idx];
  p.blocks[idx] = p.blocks[j];
  p.blocks[j] = tmp;
  drawBlocks(p.blocks); save();
}

/* ============================================================
   TASKS
   ============================================================ */
function rTasks(c, tr) {
  tr.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openTask()">+ টাস্ক</button>`;
  let list = S.tasks.slice();
  if (taskFilter.status === "open") list = list.filter(t => !t.done);
  else if (taskFilter.status === "done") list = list.filter(t => t.done);
  if (taskFilter.sort === "due") list.sort((a,b) => (a.due||"9999").localeCompare(b.due||"9999"));
  else if (taskFilter.sort === "pri") {
    const rank = { high: 0, med: 1, low: 2, "": 3 };
    list.sort((a,b) => (rank[a.pri||""]??3) - (rank[b.pri||""]??3));
  } else if (taskFilter.sort === "alpha") list.sort((a,b) => (a.title||"").localeCompare(b.title||"", "bn"));

  const overdue = list.filter(t => !t.done && t.due && t.due < today());
  const todayL = list.filter(t => !t.done && t.due === today());
  const later = list.filter(t => !t.done && (!t.due || t.due > today()));
  const doneL = list.filter(t => t.done);

  c.innerHTML = `
    <div class="filter-row">
      <select class="select" style="width:auto" onchange="taskFilter.status=this.value;render()">
        <option value="open" ${taskFilter.status==="open"?"selected":""}>চলমান</option>
        <option value="done" ${taskFilter.status==="done"?"selected":""}>সম্পন্ন</option>
        <option value="all" ${taskFilter.status==="all"?"selected":""}>সব</option>
      </select>
      <select class="select" style="width:auto" onchange="taskFilter.sort=this.value;render()">
        <option value="due" ${taskFilter.sort==="due"?"selected":""}>ডেডলাইন</option>
        <option value="pri" ${taskFilter.sort==="pri"?"selected":""}>প্রায়োরিটি</option>
        <option value="alpha" ${taskFilter.sort==="alpha"?"selected":""}>নাম</option>
      </select>
    </div>
    ${taskFilter.status !== "done" ? `
      ${overdue.length ? `<div class="section-head"><h3 style="color:var(--red)">ওভারডিউ (${overdue.length})</h3></div>${overdue.map(taskHTML).join("")}` : ""}
      ${todayL.length ? `<div class="section-head"><h3>আজ (${todayL.length})</h3></div>${todayL.map(taskHTML).join("")}` : ""}
      ${later.length ? `<div class="section-head"><h3>পরে (${later.length})</h3></div>${later.map(taskHTML).join("")}` : ""}
      ${!overdue.length && !todayL.length && !later.length && taskFilter.status==="open" ? '<div class="empty" style="padding:30px"><p>কোনো চলমান টাস্ক নেই</p></div>' : ""}
    ` : ""}
    ${(taskFilter.status === "done" || taskFilter.status === "all") && doneL.length ? `
      <div class="section-head" style="margin-top:12px"><h3>সম্পন্ন (${doneL.length})</h3></div>
      ${doneL.map(taskHTML).join("")}
    ` : ""}
  `;
}
function projectName(id) {
  const p = S.projects.find(x => x.id === id);
  return p ? p.name : "";
}
function taskHTML(t) {
  const pn = t.projectId ? projectName(t.projectId) : (t.project || "");
  return `
    <div class="item ${t.done?"done":""}">
      <input type="checkbox" class="item-check" ${t.done?"checked":""} onchange="togTask('${t.id}')">
      <div class="item-body">
        <div class="item-title">${esc(t.title)}</div>
        <div class="item-meta">${t.due?"📅 "+t.due:""}${pn?" · 📁 "+esc(pn):""}</div>
      </div>
      ${t.pri?`<span class="badge b-${t.pri==="high"?"red":t.pri==="med"?"orange":"green"}">${t.pri}</span>`:""}
      <button class="btn btn-sm" onclick="openTask('${t.id}')">এডিট</button>
      <button class="btn btn-sm btn-danger" onclick="delTask('${t.id}')">✕</button>
    </div>
  `;
}
function openTask(id) {
  const t = id ? S.tasks.find(x=>x.id===id) : null;
  const opts = S.projects.map(p => `<option value="${p.id}" ${(t?.projectId===p.id)?"selected":""}>${esc(p.name)}</option>`).join("");
  showModal(`
    <h3>${t?"টাস্ক এডিট":"নতুন টাস্ক"}</h3>
    <div class="form-group"><label>শিরোনাম</label><input class="input" id="tT" value="${esc(t?.title||"")}"></div>
    <div class="form-group"><label>প্রায়োরিটি</label>
      <select class="select" id="tP">
        <option value="">নেই</option>
        <option value="high" ${t?.pri==="high"?"selected":""}>High</option>
        <option value="med" ${t?.pri==="med"?"selected":""}>Medium</option>
        <option value="low" ${t?.pri==="low"?"selected":""}>Low</option>
      </select>
    </div>
    <div class="form-group"><label>ডেডলাইন</label><input type="date" class="input" id="tD" value="${t?.due||""}"></div>
    <div class="form-group"><label>প্রজেক্ট</label>
      <select class="select" id="tPr">
        <option value="">নেই</option>
        ${opts}
      </select>
    </div>
    <div class="form-group"><label>নোট</label><textarea class="textarea" id="tN">${esc(t?.note||"")}</textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">বাতিল</button>
      <button class="btn btn-primary" onclick="saveTask('${id||""}')">সেভ</button>
    </div>
  `);
}
function saveTask(id) {
  const title = document.getElementById("tT").value.trim();
  if (!title) return toast("শিরোনাম দিন", "err");
  const projectId = document.getElementById("tPr").value || "";
  const d = {
    title,
    pri: document.getElementById("tP").value,
    due: document.getElementById("tD").value,
    projectId,
    project: projectName(projectId),
    note: document.getElementById("tN").value
  };
  if (id) Object.assign(S.tasks.find(x=>x.id===id), d);
  else S.tasks.push({ id: uid(), ...d, done: false, created: Date.now() });
  save(); closeModal(); render();
  toast(id ? "টাস্ক আপডেট" : "টাস্ক যোগ হয়েছে", "ok");
}
function togTask(id) { const t = S.tasks.find(x=>x.id===id); if(t){t.done=!t.done;save();render();} }

function setPomo(on) {
  clearInterval(timer.interval);
  timer.running = false;
  timer.pomoMode = !!on;
  timer.secs = 0;
  timer.pomoPhase = "work";
  timer.pomoTarget = 25 * 60;
  updateTimerPill();
  render();
}
function fmtTime(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return [h,m,sec].map(n => String(n).padStart(2,"0")).join(":");
}
function tickTimer() {
  const el = document.getElementById("timerDisp");
  if (el) {
    if (timer.pomoMode) el.textContent = fmtTime(Math.max(0, timer.pomoTarget - timer.secs));
    else el.textContent = fmtTime(timer.secs);
  }
  updateTimerPill();
  if (timer.pomoMode && timer.running && timer.secs >= timer.pomoTarget) {
    clearInterval(timer.interval);
    timer.running = false;
    if (timer.pomoPhase === "work") {
      toast("পমোডোরো শেষ! ৫ মিনিট ব্রেক", "ok");
      timer.pomoPhase = "break";
      timer.pomoTarget = 5 * 60;
      timer.secs = 0;
    } else {
      toast("ব্রেক শেষ! আবার ফোকাস", "ok");
      timer.pomoPhase = "work";
      timer.pomoTarget = 25 * 60;
      timer.secs = 0;
    }
    updateTimerPill();
    if (view === "time") render();
  }
}
function persistTimerState() {
  try {
    localStorage.setItem("omar_cc_timer_state", JSON.stringify({
      running: timer.running, secs: timer.secs, label: timer.label,
      pomoMode: timer.pomoMode, pomoPhase: timer.pomoPhase, pomoTarget: timer.pomoTarget,
      startedAt: timer.running ? Date.now() : null
    }));
  } catch(e) {}
}
function timerStart() {
  if (timer.running) {
    clearInterval(timer.interval); timer.running = false;
  } else {
    timer.running = true;
    timer._baseSecs = timer.secs;
    timer._startTs = Date.now();
    clearInterval(timer.interval);
    // Timestamp-based tick: immune to setInterval drift from tab throttling
    timer.interval = setInterval(() => {
      timer.secs = timer._baseSecs + Math.floor((Date.now() - timer._startTs) / 1000);
      tickTimer();
      persistTimerState();
    }, 1000);
  }
  updateTimerPill();
  persistTimerState();
  const btn = document.getElementById("tmStartBtn");
  if (btn) btn.textContent = timer.running ? "⏸ পজ" : "▶ স্টার্ট";
  if (!timer.running && view === "time") render();
  else tickTimer();
}
function timerReset() {
  clearInterval(timer.interval); timer.running = false; timer.secs = 0;
  if (timer.pomoMode) {
    timer.pomoPhase = "work";
    timer.pomoTarget = 25 * 60;
  }
  try { localStorage.removeItem("omar_cc_timer_state"); } catch(e) {}
  updateTimerPill();
  render();
}
function restoreTimerState() {
  try {
    const raw = localStorage.getItem("omar_cc_timer_state");
    if (!raw) return;
    const st = JSON.parse(raw);
    if (!st) return;
    timer.label = st.label || "";
    timer.pomoMode = !!st.pomoMode;
    timer.pomoPhase = st.pomoPhase || "work";
    timer.pomoTarget = st.pomoTarget || 25 * 60;
    timer.secs = st.secs || 0;
    if (st.running && st.startedAt) {
      // add elapsed time while the page/tab was closed
      timer.secs += Math.floor((Date.now() - st.startedAt) / 1000);
      timer.running = true;
      timer._baseSecs = timer.secs;
      timer._startTs = Date.now();
      timer.interval = setInterval(() => {
        timer.secs = timer._baseSecs + Math.floor((Date.now() - timer._startTs) / 1000);
        tickTimer();
        persistTimerState();
      }, 1000);
    }
    updateTimerPill();
  } catch(e) {}
}
function toggleSearch() {
  const w = document.getElementById("searchWrap");
  if (!w) return;
  w.classList.toggle("open");

function lastNDays(n) {
  const a = [];
  for (let i=n-1;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); a.push(localDateStr(d)); }
  return a;
}
function streakOf(h) {
  const logs = (h.logs||[]).slice().sort().reverse();
  let s = 0; const t = new Date();
  for (let i=0;i<365;i++) {
    const d = new Date(t); d.setDate(d.getDate()-i);
    const k = localDateStr(d);
    if (logs.includes(k)) s++; else if (i>0) break;
  }
  return s;
}
function togHabit(id, day) {
  const h = S.habits.find(x=>x.id===id); if(!h) return;
  h.logs = h.logs || [];
  const i = h.logs.indexOf(day);
  if (i>=0) h.logs.splice(i,1); else h.logs.push(day);
  save(); render();
}

/* ============================================================
   ROUTINE — Professional Daily / Weekly Life OS
   ============================================================ */
let routineViewMode = "today"; // today | manage

function ensureRoutineData() {
  if (!Array.isArray(S.routines)) S.routines = [];
  if (!S.routineLogs || typeof S.routineLogs !== "object") S.routineLogs = {};
  if (S.activeRoutineId === undefined) S.activeRoutineId = null;
}

function getActiveRoutine() {
  ensureRoutineData();
  if (!S.routines.length) return null;
  let r = S.routines.find(x => x.id === S.activeRoutineId);
  if (!r) {
    r = S.routines[0];
    S.activeRoutineId = r.id;
  }
  return r;
}

function getTodayLog() {
  ensureRoutineData();
  const td = today();
  if (!S.routineLogs[td]) {
    S.routineLogs[td] = { routineId: S.activeRoutineId, done: [] };
  }
  return S.routineLogs[td];
}

function routineProgress(routine) {
  if (!routine || !routine.items || !routine.items.length) return { done: 0, total: 0, pct: 0 };
  const log = getTodayLog();
  const doneSet = new Set(log.done || []);
  const total = routine.items.length;
  const done = routine.items.filter(it => doneSet.has(it.id)).length;
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}

function routineStreak(routineId) {
  if (!routineId) return 0;
  let streak = 0;
  const t = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(t);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    const log = S.routineLogs[key];
    if (!log || log.routineId !== routineId) {
      if (i === 0) continue;
      break;
    }
    const routine = S.routines.find(r => r.id === routineId);
    if (!routine || !routine.items || !routine.items.length) break;
    const allDone = routine.items.every(it => (log.done || []).includes(it.id));
    if (allDone) streak++;
    else if (i > 0) break;
  }
  return streak;
}
